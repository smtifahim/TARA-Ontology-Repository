      "mode": "single",
      "value": "This file includes TARA Clinical Trials Knowledgebase - a structured metadata knowledgebase for acupuncture clinical trial studies developed as part of the TARA Acupoints Research project, encompassing randomized controlled trials, meta-analyses, and systematic reviews of clinical trials. The knowledgebase is derived from metadata extracted from full-text journal publications and is intended to support systematic retrieval, comparison, and quality assessment of acupuncture research studies. \n\nIt includes following classes with a rich set of metadata annotation properties:\n- Acupuncture Research Study: the physical execution of an acupuncture clinical trial, from participant recruitment and baseline grouping through administration of real or sham acupuncture procedures to final endpoint evaluation\n- Acupuncture Study Publication: the documentary artifact (e.g., journal articles) that reports on an acupuncture trial study\n- Acupuncture Study OCSI Assessment: the structured quality assessment of acupuncture trial reporting, based on the Oregon CONSORT STRICTA Instrument (OCSI)\n\nMetadata for each publication instance is captured through a standard set of annotation properties organized into three categories:\n- Bibliographic Metadata: article title, authorship, source, and publication identifiers\n- Study Metadata: intervention design, participant characteristics, sample size, outcome measures, and study outcomes\n- OCSI Item Scoring Metadata: compliance with OCSI criteria for evaluating the completeness and quality of acupuncture trial reporting"

            "hasAcupunctureIntervention"

          "altLabel": "Acupuncture_Protocol",
          "description": "A dual-purpose annotation property that serves as a super-property grouping the granular acupuncture intervention sub-properties (method, needling, stimulation, sham, and acupoints), while simultaneously acting as a direct container for a single, structured free-text summary of the full acupuncture protocol.\n\nThis field should conatin a structured summary combining acupoint selection and grouping, needling details, stimulation details, and sham protocol details into one field (see the 'example of usage' for full worked examples).",
          "comment": null,
          "examples": [
            "The value for this should be a structured information about the acupuncturue protocol used by the trial study. Here is an example structure:\n\nExample 1:\nAcupoints selection and grouping: Combination of scalp, body, and auricular acupuncture specific to the affected areas of the child and inclusive of both sides of the body.\n| Needling details: Not specified.\n| Stimulation details: Not specified.\n| Sham protocol details: No sham arm.\n\nExample 2:\nPoint selection and grouping: Trigger points in the gluteals isolated by palpation ensuring reproduction of symptoms, mostly in the region of the upper outer buttock quadrant, 3 to 5 points per subject.\n| Needling details: Sterile acupuncture needles (Seirin Corp, Shizuoka, Japan), 0.30 mm diameter, 25 mm long; pierced skin and advanced into trigger point until reproduction of pain or local twitch response; partially withdrawn and repeatedly advanced into muscle until pain resolved and no further twitches seen; retention time Not specified.\n| Stimulation details: Manual repeated advancement into the muscle; no electrical or thermal stimulation.\n| Sham protocol details: Non-penetrating modified acupuncture needle with sharp tip removed and glued back in sheath; tip applied to the skin over the trigger point with pressure for 10 or more seconds and moved slightly to simulate real needling, repeated at each point for up to one minute."
          ],
          "source": [],
          "citation": [],

          "synonyms": [],
          "altLabel": null,
          "description": "A dual-purpose annotation property that serves as a super-property grouping 'Acupoint Selection' and 'Acupoint Grouping', while simultaneously acting as a direct container for a combined free-text statement about Acupoints Seclection and Grouping.",
          "comment": "In clinical trials evaluating acupuncture, acupoint selection is the specific choice of body sites (the points) where needles are inserted based on traditional theory or modern neuroscience. Acupoint grouping (or combination) refers to how these points are paired together in a treatment prescription to work synergistically for a medical condition.",
          "examples": [
            "\"Point selection and grouping: Verum points selected from a prescribed list (part standardisation) consisting of obligatory points and additional points individually chosen based on TCM diagnosis for syndromes, acupuncture channels related to the individual headache area, and Ah Shi points; needling was bilateral.\""

          "parent": "tara-kb:hasStudyDesignMetadata",
          "children": [],
          "synonyms": [],
          "altLabel": "Control_Groups_Details",
          "description": "An annotation property to capture structured details about the control group methodologies (control arms) deployed within a clinical trial study, as reported in a journal publication. It explicitly documents the specific type of control utilized, such as sham interventions, non-acupoint/minimal treatments, active controls, or waitlists, along with critical methodological protocols, including patient blinding mechanisms, the physiological nature of the control, and any deviations from standard or traditional practices meant to isolate specific therapeutic variables.",
          "comment": "Acupuncture control groups are fundamentally classified into four main methodological paradigms:\n1) Sham Acupuncture: Placebo needling using non-penetrating retracting devices to isolate needling-specific effects;\n2) Real Acupuncture at Non-Acupoints: Minimal acupuncture using standard needles at non-meridian locations to isolate point-specificity;\n3) Active Control: Ttreatment-as-usual, standard care, or pharmacotherapy to test clinical superiority/equivalence; and\n4) Waitlist or No-Treatment Control: To measure natural disease progression. \n\nNote: Researchers must account for the 'physiological sham effect,' where even non-penetrating skin pressure or non-acupoint stimulation can trigger local neurological and circulatory responses, meaning these controls are rarely completely inert.",
          "examples": [
            "Control Arm 1 - Sham Acupuncture: Deployed Streitberger non-penetrating placebo needles at valid acupoints. Patients were successfully blinded to needle penetration, though mild skin pressure-induced neurological stimulation remains a potential confounding physiological sham effect.\n\nControl Arm 2 - Non-Acupoint Real Needling: Used identical standard 0.25mm stainless steel needles fully inserted to standard depths (15mm), but placed 2-3 cm away from traditional meridians in anatomically neutral zones to test point-specificity.\n\nControl Arm 3 - Active Control: Standard Care regimen consisting of prescribed physical therapy twice weekly and open-label Naproxen (500mg daily) to evaluate clinical superiority.",
            "Sham acupuncture: Patients received sham acupuncture once a week for 6 weeks, using blunt-tipped needles that did not penetrate the skin, as a control group to compare with true acupuncture."
          ],
          "source": [],
          "citation": [],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null

          ],

          "description": "A dual-purpose annotation property that serves as a super-property grouping the interpreted findings sub-properties (clinical conclusions, comparative findings, effectiveness, main results, and proposed mechanism), while simultaneously acting as a direct container for a general free-text stuctured summary of the study's findings when a more specific sub-property does not apply.\n\nThis field should faithfully summarize what the paper reports as main results (the core numeric and statistical information of the primary and secondary endpoints) and clinical conclusions in a structured way, potentially including short direct quotations where appropriate.",

          "examples": [

          "synonyms": [],
          "altLabel": "Study_Assessment_Metadata",
          "description": "An annotation property that serves as a high-level grouping property under which specific quality appraisal properties are defined to record evaluative quality data, risk-of-bias scores, and methodological rigor metrics calculated for a clinical trial study.\n\nCrucially, the values asserted by the sub-properties under this property are not raw data elements directly extracted or verbatim copied from the published journal article. Instead, they represent secondary, derived appraisals generated, either algorithmically by automated computational models or manually by human domain experts, by evaluating an extracted set of primary metadata against standardized scoring frameworks and quality assessment criteria (such as OCSI).",

        "tara-kb:hasOCSIItemScoringMetadata": {
          "id": "tara-kb:hasOCSIItemScoringMetadata",
          "kind": "annotationProperty",
          "storeKey": "annotationProperties",
          "label": "OCSI Item Scoring Metadata",
          "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasOCSIItemScoringMetadata",
          "grouping": true,
          "domain": "TARA:2825659",
          "domainLabel": "Acupuncture Study OCSI Assessment",

          "parent": "tara-kb:hasStudyQualityAssessmentMetadata",
          "children": [
            "tara-kb:hasStudyRationaleAndScopeMetrics",
            "tara-kb:hasAcupunctureInterventionMetrics",
            "tara-kb:hasStudyDesignAndAnalysisMetrics",
            "tara-kb:hasResultsAndDiscussionMetrics",
            "tara-kb:hasOCSITotalPercentage"
          ],
          "synonyms": [],
          "altLabel": "OCSI_Item_Scoring_Metadata",
          "description": "An annotation property that serves as a master grouping property for capturing quality assessment metrics mapped to individual reporting items within the Oregon CONSORT STRICTA Instrument (OCSI) for acupuncture trials. \n\nTARA-KB's sub-grouping of OCSI assessment categories (A-D), aggregate derived compliance values specifically tied to the combined CONSORT (Consolidated Standards of Reporting Trials) and STRICTA (Standards for Reporting Interventions in Clinical Trials of Acupuncture) guidelines. It organizes granular sub-properties tracking item-by-item compliance scores, separating the calculated evaluation of reporting quality from the raw extracted study parameters.\n\nThe sub-grouping properties across all four categories (A-D), are reporting-quality metrics: they assess how completely and transparently a trial was described in its published article, not the intrinsic quality, appropriateness, or clinical merit of the trial's design, intervention, or conduct. A high OCSI score means the article reported its methods and results thoroughly; it does not mean the underlying trial was well-designed or its findings reliable.",
          "comment": "Item questions (Table 1) and scoring rubrics (Appendix A) reproduced under the CC-BY license, with attribution to the original authors. / Scoring scale and total score formula (Hammerschlag et al. 2011, Section 2.1 and 2.3):\n- Each of the 27 OCSI questions is scored yes = 2, partial = 1, no = 0, or Not Applicable = N/A, based on the composite scoring of its lettered sub-questions. A question is scored partial if its sub-questions receive a mix of ratings.\n- An article's total OCSI score is calculated as: raw score ÷ (2 × [27 − n items scored N/A]) × 100, i.e., items scored N/A are excluded from both the numerator and the denominator rather than counted as zero.",
          "examples": [],
          "source": [],
          "citation": [
            "Hammerschlag R, Milley RJ, Colbert A, Weih J, Yohalem-Ilsley B, Mist S, Aickin M. Randomized Controlled Trials of Acupuncture (1997–2007): An Assessment of Reporting Quality with a CONSORT- and STRICTA-Based Instrument. Evidence-Based Complementary and Alternative Medicine. 2011;2011:183910. https://doi.org/10.1155/2011/183910"
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "General scoring instructions (OCSI Manual, Appendix A.1): \n\n(i) When scoring each question, consider whether a reviewer would be satisfied with what is reported, and whether the details given would be sufficient to reproduce the findings. \n\n(ii) When multiple components or \"and\" statements are listed for a question, all aspects must be met to receive full credit.\n\n(iii) Except for item no. 1, if the information is placed anywhere in the document, the question can receive full credit.\n\n(iv) For items 4-9 (from STRICTA), nos. 4-8 pertain only to the acupuncture aspects of the study, while no. 9 pertains to all types of control or comparison groups. \n\n(v) Practitioners are almost always NOT blinded in acupuncture research; hence item 16(b) is usually scored N/A.",
              "id": null
            }
          ],
          "extra__dcterms_license": [
            {
              "label": "",
              "id": "https://creativecommons.org/licenses/by/4.0/"
            }

            "tara-kb:hasNeedlingParametersScore",
            "tara-kb:hasPractitionerScore",
            "tara-kb:hasFrequencyOfTreatmentScore"
          ],
          "synonyms": [],
          "altLabel": "Acupuncture_Intervention_Metrics",
          "description": "This is a TARA-KB convention of categorization: Category B, Acupuncture Intervention Metrics, groups OCSI items 4 through 9, which report on the acupuncture intervention itself and correspond one-to-one, in order, to the six official STRICTA 2010 checklist items -- (1) Acupuncture rationale, (2) Details of needling, (3) Treatment regimen, (4) Other components of treatment, (5) Practitioner background, (6) Control or comparator interventions -- since Hammerschlag et al. 2011 state these six items substitute for CONSORT's own item 4.",
          "comment": "The umbrella label 'Acupuncture Intervention Metrics' and its place in this ontology's four-category scheme (A/B/C/D) are a TARA-KB convention, not STRICTA's own terminology. This category's item membership (OCSI items 4-9), however, is directly traceable to STRICTA (MacPherson et al. 2010), with an exact one-to-one, in-order correspondence to STRICTA's six official checklist items. Unlike an earlier version of this ontology, hasSampleSizeScore (OCSI item 12) is no longer nested here: item 12 is a plain CONSORT item (sample size determination), not one of STRICTA's six items, and has been moved to Category C (hasStudyDesignAndAnalysisMetrics), making this category's membership an exact match to STRICTA's item set.",
          "examples": [
            "e.g., an aggregate value of 12 summarizing the combined STRICTA-aligned sub-scores (acupuncture details, needling parameters, treatment frequency, cointerventions, practitioner background, control group details)."
          ],
          "source": [
            "https://doi.org/10.1371/journal.pmed.1000261"
          ],
          "citation": [
            "MacPherson H, Altman DG, Hammerschlag R, Youping L, Taixiang W, White A, Moher D; STRICTA Revision Group. Revised STandards for Reporting Interventions in Clinical Trials of Acupuncture (STRICTA): extending the CONSORT statement. PLoS Med. 2010;7(6):e1000261. doi:10.1371/journal.pmed.1000261. (Concurrently published in Acupuncture in Medicine 2010;28(2):83-93, doi:10.1136/aim.2009.001370, and Journal of Alternative and Complementary Medicine 2010;16(10):ST-1-14.)"
          ],

              "id": null
            }

          "altLabel": "Acupuncture_Details_Score",
          "description": "Category B: Acupuncture Intervention Metrics (STRICTA). The STRICTA-aligned score evaluating the general description of the acupuncture style and rationale.",
          "comment": null,
          "examples": [
            "e.g., a score of 2 when the acupuncture style and its rationale are both fully described, 1 when only partially described, or 0 when neither is reported."

              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "(a) Is the style of acupuncture stated?\n\n(b) Is the rationale presented for the selection of acupuncture points?\n\n(c) Was the rationale justified?",
              "id": null

          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "(a) Style of acupuncture can be implied from the author affiliation information; for example, authors were from the Beijing TCM hospital, so style is TCM. If the protocol utilized a single acupoint or only lists the names of the acupoint(s), the style still needs to be stated.\n\n(b) For example, the acupoints were chosen on the basis of text books, practitioner survey, or prior research.\n\n(c) Justified, for a YES score, requires citing journals, texts, practitioner survey, or an expert panel.",
              "id": null
            }
          ],

          "extra__tara_ap_hasAssessmentQuestion": [

          "extra__tara_ap_hasScoringInstructions": [

              "label": "It refers only to cointerventions within the scope of acupuncture licensure. If the protocol specifies the option of prescribed self-help treatments, for example, exercise advice, stretching, or qi gong, these must also be described. Scored N/A if no adjunctive treatment was provided to the acupuncture group.",

        "tara-kb:hasControlGroupsScore": {

          "label": "Control Groups Score",
          "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasControlGroupsScore",

          "children": [],
          "synonyms": [],
          "altLabel": "Control_Groups_Score",
          "description": "Category B: Acupuncture Intervention Metrics (STRICTA). The quality check score evaluating how thoroughly the rationales and structural formats of the comparative groups are reported.",
          "comment": null,
          "examples": [
            "e.g., a score of 2 when the rationale and precise composition of each comparator arm are described, or 0 when comparator groups are only named without detail."
          ],
          "source": [],
          "citation": [],
          "extra__tara_ap_hasOCSIItemNumber": [
            {
              "label": "9",
              "id": null
            }
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "(a) Is the intended effect of the control or comparison intervention presented?\n\n(b) Were the specific explanations given to patients of the treatment and control interventions presented?\n\n(c) Are details for the control or comparison intervention presented?\n\n(d) Are sources provided, that justify the choice of the control or comparison intervention?",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "A no-treatment control is scored the same as a sham or comparison control.\n\n(a) Intended effect refers to the specific rationale for choosing the control (including no treatment).\n\n(b) Specific explanations refers to the specific wording the patient receives regarding the treatment and control procedures.\n\n(c) Details refers to a precise description of the control intervention, including (if applicable, e.g., invasive sham) the parameters of needling (item 5(a)-(g)). This includes no treatment controls, for example, who may have been required to keep diaries. If no tracking was performed, it must be stated.\n\n(d) Justification refers to citing journals, textbooks, practitioner survey, or an expert consensus panel.",
              "id": null
            }
          ],
          "extra__tara_ap_hasCompactURI": [
            {
              "label": "tara-kb:hasControlGroupsScore",
              "id": null
            }
          ]
        },

        "tara-kb:hasNeedlingParametersScore": {
          "id": "tara-kb:hasNeedlingParametersScore",

          "altLabel": "Needling_Parameters_Score",
          "description": "Category B: Acupuncture Intervention Metrics (STRICTA). The technical item score checking the completeness of needle parameters reported (e.g., gauge, depth, de qi sensation).",
          "comment": null,
          "examples": [
            "e.g., a score of 2 when needle gauge, insertion depth, and de qi response are all reported, or 0 when none of these parameters are given."
          ],
          "source": [],
          "citation": [],
          "extra__tara_ap_hasOCSIItemNumber": [
            {
              "label": "5",
              "id": null
            }
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "Are the following parameters of needling presented?\n\n(a) Points used (uni/bilateral)\n\n(b) Number of needles inserted\n\n(c) Depth(s) of insertion\n\n(d) Response elicited (e.g., de qi)\n\n(e) Needle stimulation (manual or electrical)\n\n(f) Needle retention time\n\n(g) Needle type (Material and/or manufacturer, gauge, and length)",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "(a) Unilateral or bilateral can be implied.\n\n(b) If the treatment protocol is individualized, then the authors must state the range of needles utilized (e.g., 8-14 needles). This may be implied from (a).\n\n(c) If the treatments were individualized, the depths must be given as a range, expressed in Cun, mm, or anatomical depth.\n\n(d) Response refers to needle sensations such as de qi (TCM), muscle twitch (trigger point), or muscle contraction (electroacupuncture).\n\n(e) Stimulation refers to techniques in manual acupuncture (lifting, thrusting, or rotating) or electroacupuncture (current, frequency, amplitude).\n\n(f) If treatments were individualized, retention time must be reported as a mean and range.\n\n(g) It must state the gauge, length, and material and/or manufacturer of the needles.",
              "id": null
            }
          ],
          "extra__tara_ap_hasCompactURI": [
            {
              "label": "tara-kb:hasNeedlingParametersScore",
              "id": null
            }
          ]
        },

        "tara-kb:hasOCSITotalPercentage": {
          "id": "tara-kb:hasOCSITotalPercentage",
          "kind": "annotationProperty",
          "storeKey": "annotationProperties",
          "label": "OCSI Total Percentage",
          "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasOCSITotalPercentage",
          "grouping": false,
          "domain": "TARA:2825659",
          "domainLabel": "Acupuncture Study OCSI Assessment",

          },
          "parent": "tara-kb:hasOCSIItemScoringMetadata",
          "children": [],
          "synonyms": [],
          "altLabel": "OCSI_Total_Percentage",
          "description": "The global reporting-quality percentage for a study's OCSI assessment, calculated per Hammerschlag et al. 2011 as: raw score / (2 x [27 - n items scored N/A]) x 100. Unlike the 27 item-level score properties nested under the four OCSI categories, this is a derived summary value and is therefore attached directly to hasOCSIItemScoringMetadata rather than to any single category.",
          "comment": null,
          "examples": [
            "e.g., 82.5 (representing 82.5% overall compliance across all OCSI-scored items)."
          ],
          "source": [],
          "citation": [],
          "extra__dcterms_creator": [

          "altLabel": "Analysis_Population_Score",
          "description": "Category D: Results and Discussion Metrics. The reporting score assessing whether the number of participants included in each analysis, use of an intention-to-treat analysis, and results in absolute numbers are stated.",
          "comment": null,
          "examples": [
            "e.g., a score of 2 when per-analysis sample sizes, an intention-to-treat analysis, and absolute numbers are all reported, or 0 when none of these are given."
          ],
          "source": [],
          "citation": [],
          "extra__tara_ap_hasOCSIItemNumber": [
            {
              "label": "21",
              "id": null
            }
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "(a) Is the number of participants in each group included in each analysis?\n\n(b) Was the intention to treat analysis presented?\n\n(c) When feasible, are the results stated in absolute numbers (e.g., 10 of 20, not just 50%)?",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "(a) For full credit, it must state the n per each analysis, since the actual n may vary per outcome. If no dropouts occurred, the n can be implied.\n\n(b) Must use an intention to treat analysis (or a valid substitute) to avoid bias associated with non-random loss of participants.\n\n(c) It must state absolute numbers, for example, reduction of VAS pain from 10 to 5, not just a 50% reduction.",
              "id": null
            }
          ],
          "extra__tara_ap_hasCompactURI": [
            {
              "label": "tara-kb:hasAnalysisPopulationScore",
              "id": null
            }

        "tara-kb:hasResultsOutcomesScore": {
          "id": "tara-kb:hasResultsOutcomesScore",
          "kind": "annotationProperty",
          "storeKey": "annotationProperties",
          "label": "Results Outcomes Score",
          "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasResultsOutcomesScore",
          "grouping": false,
          "domain": "TARA:2825659",
          "domainLabel": "Acupuncture Study OCSI Assessment",
          "range": {
            "kind": "datatype",
            "id": "tara-kb:ocsiItemScore",
            "label": "ocsiItemScore"
          },
          "parent": "tara-kb:hasResultsAndDiscussionMetrics",
          "children": [],
          "synonyms": [],
          "altLabel": "Results_Outcomes_Score",
          "description": "A quality metric within Category D: Results and Discussion Metrics that assesses the completeness, transparency, and accuracy of the reported results for each predefined primary and secondary outcome measure, evaluating whether the text explicitly provides estimated effect sizes, confidence intervals, and precise statistical significance values (e.g., p-values) for each endpoint.",
          "comment": "To maintain data integrity and prevent construct contamination within the metadata schema, ensure that the data extraction models treat the following two properties separately:\n1. hasOutcomesMeasureX2Score (Methodology/Design Check): Focuses on the definition and planned pairing of tests. (e.g., Did they tell us in the Methods section how they planned to calculate the math?)\n2. hasResultsOutcomesScore (Reporting/Transparency Check): Focuses on the execution and transparency of the actual data. (e.g., Did they actually show us the exact numbers, tables, effect sizes, and p-values in the Results section?)",
          "examples": [
            "Standardized Scoring Rubric (0–3 Scale) \nFollowing the standardized OCSI Likert-like scoring structure, the reporting of results should be scored based on the level of statistical disclosure and data transparency:\n- 3 (Full Compliance): The study provides exact data for all predefined outcomes (whether evaluating a single primary outcome or primary + secondary outcomes). This includes specific numbers/estimates, precision metrics (e.g., 95% Confidence Intervals), and exact p-values for each finding.\n- 2 (Substantial Compliance): Results are provided for all main outcomes, but exact statistical precision reporting is slightly flawed (e.g., reporting a generic \"p < 0.05\" or omitting confidence intervals for a minor secondary outcome).\n- 1 (Partial Compliance): The study omits data for a major outcome, or results are reported selectively/vaguely (e.g., stating in text that \"group differences were not significant\" without actually providing the underlying data table or values).\n- 0 (Non-compliance): No empirical results or raw data are presented for the stated primary outcomes, or data reporting is missing entirely.",
            "e.g., a score of 2 when reported results directly correspond to the pre-registered outcome measures, or 0 when a mismatch or omission exists."
          ],
          "source": [],
          "citation": [],
          "extra__tara_ap_hasOCSIItemNumber": [
            {
              "label": "22",
              "id": null
            }
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "For each primary and (if applicable) secondary outcome, is\n\n(a) a summary of results presented for each group,\n\n(b) the estimated effect size presented for each between-group difference (e.g., SD), and\n\n(c) the precision of the effect size presented for each between-group difference (e.g., confidence interval (CI))?",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "(a) It must state the results or use a table/graph, for example, the mean and standard deviation of the measurements.\n\n(b) All results must indicate the effect size, for example, the difference in means, odds ratio, or relative risk ratio.\n\n(c) For full credit, authors must state precision as a confidence interval (CI). Only presenting P-values will score a partial.",
              "id": null
            }
          ],
          "extra__tara_ap_hasCompactURI": [
            {
              "label": "tara-kb:hasResultsOutcomesScore",
              "id": null
            }
          ]
        },

          "description": "This is a TARA-KB convention of categorization: Category C, Study Design and Analysis Metrics, groups the OCSI items describing how a trial was planned and how its analysis was designed -- outcome measure definitions (item 11), sample size determination (item 12), random allocation sequence generation and concealment (items 13-14), allocation personnel (item 15), blinding (item 16), and statistical methods (item 17).",
          "comment": "This four-way category scheme (A/B/C/D) is a TARA-KB organizational convention, not sourced from Hammerschlag et al. 2011 (the OCSI paper) or the CONSORT 2010 checklist. This category's members do, however, correspond closely to CONSORT's own Methods section (Outcomes, Sample size, Randomisation, Blinding, Statistical methods), distinguishing planned trial design and analysis content from the reported/executed content grouped under Category D.",

          "synonyms": [],
          "altLabel": "Allocation_Personnel_Score",
          "description": "Category C: Study Design and Analysis Metrics. The reporting score assessing whether the article states who generated the randomization sequence, who enrolled participants, and who assigned participants to their groups.",
          "comment": null,
          "examples": [
            "e.g., a score of 2 when the article names who generated the allocation sequence, who enrolled participants, and who assigned them to groups, or 0 when none of these roles are reported."
          ],
          "source": [],
          "citation": [],
          "extra__tara_ap_hasOCSIItemNumber": [
            {
              "label": "15",
              "id": null
            }
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "Are there statements as to\n\n(a) who generated the allocation sequence,\n\n(b) who enrolled participants, and\n\n(c) who assigned participants to their groups?",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "(a) It must specifically state the person responsible for generating the randomization.\n\n(b) It refers to the specific person(s) responsible for consenting the participants.\n\n(c) It refers to the person who assigned participants to their respective randomized groups; if this person also generated the randomization scheme, the authors should report how the potential for biased group assignments was addressed.",
              "id": null
            }
          ],
          "extra__tara_ap_hasCompactURI": [

        "tara-kb:hasBlindingQualityScore": {
          "id": "tara-kb:hasBlindingQualityScore",
          "kind": "annotationProperty",
          "storeKey": "annotationProperties",
          "label": "Blinding Quality Score",
          "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasBlindingQualityScore",
          "grouping": false,
          "domain": "TARA:2825659",
          "domainLabel": "Acupuncture Study OCSI Assessment",
          "range": {
            "kind": "datatype",
            "id": "tara-kb:ocsiItemScore",
            "label": "ocsiItemScore"
          },
          "parent": "tara-kb:hasStudyDesignAndAnalysisMetrics",
          "children": [],
          "synonyms": [
            "hasDetectionBiasMitigationScore"
          ],
          "altLabel": "Blinding_Quality_Score",
          "description": "Category C: Study Design and Analysis Metrics. The quality check score auditing whether the trial describes who was masked to assignments (e.g., patients, operators, assessors).",
          "comment": null,
          "examples": [
            "Standardized Scoring Rubric (0–3 Scale)\n- 3 (Excellent): The study explicitly details active methods used to enhance measurement quality and prevent bias (e.g., using a strictly blinded independent observer).\n- 2 (Good): The study mentions that observers or assessors were \"blinded,\" but lacks hyper-specific details on the logistical execution (e.g., fails to mention when they entered the room).\n- 1 (Poor): The study hints at attempts to keep measurements objective, but blinding is incomplete, or the design makes blinding highly vulnerable to unblinding.\n- 0 (Non-compliant): No measures were taken to enhance measurement quality, or the outcomes were assessed openly by the same individuals who performed the intervention (high risk of bias).",
            "e.g., a score of 2 when blinding status is stated for participants, practitioners, and outcome assessors, or 0 when blinding is not addressed."
          ],
          "source": [],
          "citation": [],
          "extra__tara_ap_hasOCSIItemNumber": [
            {
              "label": "16",
              "id": null
            }
          ],
          "extra__dcterms_creator": [
            {
              "label": "Fahim Imam - https://orcid.org/0000-0003-4752-543X",
              "id": null
            }
          ],
          "extra__tara_ap_hasAssessmentQuestion": [
            {
              "label": "Is it stated whether or not\n\n(a) participants,\n\n(b) those administering the interventions, and\n\n(c) those assessing the outcomes were blinded? and\n\n(d) was the success of participant blinding evaluated?",
              "id": null
            }
          ],
          "extra__tara_ap_hasScoringInstructions": [
            {
              "label": "(a) It must state that patients were blinded to group assignments. If the trial was a comparison of active treatments, this will be scored N/A.\n\n(b) Practitioners are almost always NOT blinded in acupuncture research; this will usually be scored N/A.\n\n(c) It must state whether or not the persons performing outcome measures were blinded to group assignments.\n\n(d) For full credit, authors must state that the success of participant blinding was evaluated and present the results of the assessment.",
              "id": null
            }
          ],
          "extra__tara_ap_hasCompactURI": [
            {
              "label": "tara-kb:hasBlindingScore",
              "id": null
            }
          ]
        },

          "examples": [

          "altLabel": "Study_Rationale_And_Scope_Metrics",
          "description": "This is a TARA-KB convention of categorization: Category A, Study Rationale and Scope Metrics, groups the OCSI items that establish why a trial was undertaken and what it covers before its methods and results are reported -- scientific background and rationale (item 2) and the stated objectives and hypothesis (item 10) address the rationale; eligibility criteria and study setting (item 3) define the trial's population and location scope. The randomization statement (item 1) is grouped here as a scope-defining fact in a different sense -- it discloses what kind of trial this is (randomized) rather than its population or setting -- rather than as a strict domain match; see rdfs:comment for further explanation of this placement.",
          "comment": "This four-way category scheme (A/B/C/D) is a TARA-KB organizational convention, not sourced from Hammerschlag et al. 2011 (the OCSI paper), the CONSORT 2010 checklist, or the STRICTA 2010 checklist. Both CONSORT and STRICTA organize their own checklist items by manuscript section (Title/Abstract, Introduction, Methods, Results, Discussion) or by protocol-description topic, not by a four-category thematic taxonomy of this kind. This grouping exists for KB navigation and LLM-prompt structuring, not as a claim about the instrument's own domain structure. Note on item 1 (hasRandomizationStatementScore): 'scope' is used in two distinct senses across this category's members -- for item 3, scope means population and setting boundaries; for item 1, scope means the trial's design-type disclosure (that it is randomized). This is an intentional, documented stretch of the label rather than an oversight.",
          "examples": [],
