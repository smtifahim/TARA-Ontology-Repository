<script>
(function () {
  const DATA = JSON.parse(document.getElementById('ontology-data').textContent);
  const STORES = DATA.stores;             // { classes: {records, roots}, annotationProperties: {...}, objectProperties: {...}, dataTypes: {...} }
  // One field list per hierarchy tab (classes/annotationProperties/
  // objectProperties/dataTypes) - each includes that kind's own discovered
  // predicates (see extract_discovered_fields in the generator), so Classes
  // and Data Types don't offer each other's unrelated predicates. Mutated in
  // place by the settings panel (reordered via splice, hidden via the
  // __hidden flag) so every render path picks up a change immediately.
  const DETAIL_FIELDS_BY_KIND = DATA.detailFieldsByKind;
  const SUMMARY_FIELDS = DATA.summary;
  function fieldsFor(rec) {
    return DETAIL_FIELDS_BY_KIND[rec.storeKey];
  }
  function activeFields(fields) {
    return fields.filter(f => !f.__hidden);
  }
  const CATEGORY_TABS = DATA.tabs.filter(t => t.id !== 'summary');
  const HAS_SUMMARY = DATA.tabs.some(t => t.id === 'summary');

  function recordOf(id) {
    for (const key of Object.keys(STORES)) {
      if (STORES[key].records[id]) return STORES[key].records[id];
    }
    return null;
  }
  function storeKeyOf(id) {
    const rec = recordOf(id);
    return rec ? rec.storeKey : null;
  }

  // A class/datatype curie is "native" to this ontology (e.g. acupoints'
  // TARA:) if its own URI is actually in the ttl's base namespace, vs.
  // "external" (e.g. UBERON:/ILX:/MONDO:/HP:) - pulled in only because
  // include_imported_terms is on. Used to decide how a top-of-panel class
  // curie badge (the header's own kind+id badge, and Domain/Range) behaves
  // when clicked - see curieClickHandler().
  const BASE_NAMESPACE = DATA.baseNamespace;
  function isNativeRecord(rec) {
    return !!(rec && rec.uri && rec.uri.indexOf(BASE_NAMESPACE) === 0);
  }

  // Click behavior for a class/datatype curie badge at the top of the
  // content panel (the header's own kind+id badge, and Domain/Range): a
  // native curie navigates in place, same as everywhere else in the app; an
  // external one (e.g. an imported UBERON:/ILX:/MONDO:/HP:/etc. reference)
  // opens its own real URI in a new tab instead, so you land on that term's
  // actual source page (typically an OBO PURL, which redirects to the
  // defining ontology's own browser) rather than anywhere in this app.
  // Returns null (not clickable) if `id` doesn't resolve to any record at all.
  function curieClickHandler(id) {
    const target = id ? recordOf(id) : null;
    if (!target) return null;
    if (isNativeRecord(target)) return () => selectNode(id);
    return () => window.open(target.uri, '_blank', 'noopener,noreferrer');
  }

  // ---- top tab bar (Summary / Classes / Annotation Properties / Object Properties / Data Types) ----
  const tabBarEl = document.getElementById('main-tabs');
  let activeTab = null;          // currently shown right-panel tab id
  let activeCategory = null;     // currently shown sidebar category id (one of CATEGORY_TABS' ids)

  DATA.tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = t.id;
    btn.textContent = t.label;
    btn.addEventListener('click', () => selectTab(t.id));
    tabBarEl.appendChild(btn);
  });

  function markActiveTabButton() {
    tabBarEl.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  }

  function selectTab(tabId) {
    activeTab = tabId;
    markActiveTabButton();
    if (tabId === 'summary') {
      renderSummary();
      // sidebar hierarchy stays exactly as it was - Summary has no tree of its own
      return;
    }
    if (activeCategory !== tabId) {
      activeCategory = tabId;
      renderSidebarTree(activeCategory);
    }
    const sel = selectedId && storeKeyOf(selectedId) === activeCategory ? selectedId : null;
    if (sel) {
      renderDetail(sel);
    } else {
      clearContentPanel();
    }
  }

  // ---- resizable splitter (sidebar width, capped at 35% of page width) ----
  const sidebarEl = document.getElementById('sidebar');
  const splitterEl = document.getElementById('splitter');
  const SIDEBAR_MIN_WIDTH = 220;
  let splitterDragging = false;
  // The width the sidebar "returns to" once auto-fit (below) decides it no
  // longer needs the extra room a deep expansion asked for - starts at the
  // CSS default, but becomes whatever the user last dragged it to, so a
  // manual resize is a real preference, not just a base auto-fit keeps
  // overriding on the very next toggle.
  let sidebarBaseWidth = sidebarEl.getBoundingClientRect().width || 340;

  splitterEl.addEventListener('mousedown', (e) => {
    splitterDragging = true;
    splitterEl.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!splitterDragging) return;
    const maxWidth = window.innerWidth * 0.35;
    const newWidth = Math.min(Math.max(e.clientX, SIDEBAR_MIN_WIDTH), maxWidth);
    sidebarEl.style.width = newWidth + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!splitterDragging) return;
    splitterDragging = false;
    splitterEl.classList.remove('dragging');
    document.body.style.userSelect = '';
    sidebarBaseWidth = sidebarEl.getBoundingClientRect().width;
  });

  // Grows the sidebar to fit however far the currently-expanded tree
  // actually extends (so a deep expansion doesn't just wrap/clip), up to
  // the same 35%-of-window cap the manual splitter respects; shrinks it
  // back down to sidebarBaseWidth (never below - that's the user's own
  // baseline, not a hard minimum content needs) once nothing expanded needs
  // the extra room any more. A deep tree that still doesn't fit even at the
  // cap gets #sidebar's own horizontal scrollbar instead (see its
  // overflow-x: auto and .node-label's white-space: nowrap).
  function autoFitSidebarWidth() {
    if (splitterDragging) return; // don't fight an active manual drag
    const treeEl = document.getElementById('sidebar-tree');
    // scrollWidth alone won't shrink back on its own: since #sidebar-tree
    // fills #sidebar's current (possibly already-widened) width, its
    // clientWidth is that same wide width, and scrollWidth is defined as
    // at least clientWidth - so once widened, it reads as "still needs to
    // be this wide" forever, even after the deep node that justified it
    // gets collapsed. Forcing the sidebar down to a width narrower than any
    // real content first makes scrollWidth reflect the tree's actual
    // current (nowrap) content width instead of just echoing back its own
    // stale container width. This causes a synchronous layout reflow, but
    // the real width is written before the next paint, so it's invisible.
    const prevWidth = sidebarEl.style.width;
    sidebarEl.style.width = '0px';
    const contentWidth = treeEl.scrollWidth;
    sidebarEl.style.width = prevWidth;

    const maxWidth = window.innerWidth * 0.35;
    const needed = Math.max(contentWidth + 20, sidebarBaseWidth);
    sidebarEl.style.width = Math.max(Math.min(needed, maxWidth), SIDEBAR_MIN_WIDTH) + 'px';
  }

  // ---- tree rendering ----
  const TOGGLE_COLLAPSED = '▶'; // ▶
  const TOGGLE_EXPANDED = '▼'; // ▼
  let DEFAULT_EXPANDED_DEPTH = DATA.defaultExpandedDepth; // 0-indexed: depth < this starts expanded (configured via OntologyDocConfig.default_expanded_depth; overridable from the settings panel)

  function buildNode(id, store, depth) {
    depth = depth || 0;
    const rec = store[id];
    const li = document.createElement('li');
    li.dataset.id = id;

    const row = document.createElement('div');
    row.className = 'node-row' + (rec.grouping ? ' grouping' : '');
    row.dataset.id = id;

    const hasChildren = rec.children && rec.children.length > 0;
    const toggle = document.createElement('span');
    toggle.className = 'toggle' + (hasChildren ? '' : ' leaf');
    toggle.textContent = hasChildren ? TOGGLE_COLLAPSED : '-';
    row.appendChild(toggle);

    const label = document.createElement('span');
    label.className = 'node-label';
    label.textContent = rec.label;
    row.appendChild(label);

    li.appendChild(row);

    let childUl = null;
    if (hasChildren) {
      const startExpanded = depth < DEFAULT_EXPANDED_DEPTH;
      childUl = document.createElement('ul');
      childUl.style.display = startExpanded ? '' : 'none';
      toggle.textContent = startExpanded ? TOGGLE_EXPANDED : TOGGLE_COLLAPSED;
      rec.children.forEach(cid => childUl.appendChild(buildNode(cid, store, depth + 1)));
      li.appendChild(childUl);

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = childUl.style.display !== 'none';
        childUl.style.display = open ? 'none' : '';
        toggle.textContent = open ? TOGGLE_COLLAPSED : TOGGLE_EXPANDED;
        autoFitSidebarWidth();
      });
    }

    row.addEventListener('click', () => selectNode(id));
    return li;
  }

  function renderSidebarTree(categoryId) {
    const container = document.getElementById('sidebar-tree');
    container.innerHTML = '';
    const storeData = STORES[categoryId];
    if (!storeData) return;
    const ul = document.createElement('ul');
    storeData.roots.forEach(rid => ul.appendChild(buildNode(rid, storeData.records, 0)));
    container.appendChild(ul);
    autoFitSidebarWidth();
  }

  function expandAncestors(id) {
    const rec = recordOf(id);
    if (!rec) return;
    const store = STORES[rec.storeKey].records;
    let cur = rec.parent;
    while (cur) {
      const row = document.querySelector('.node-row[data-id="' + cur + '"]');
      if (row) {
        const li = row.parentElement;
        const ul = li.querySelector(':scope > ul');
        if (ul) {
          ul.style.display = '';
          const t = row.querySelector('.toggle');
          if (t && !t.classList.contains('leaf')) t.textContent = TOGGLE_EXPANDED;
        }
      }
      cur = store[cur] ? store[cur].parent : null;
    }
    autoFitSidebarWidth();
  }

  // ---- selection & detail panel ----
  let selectedId = null;

  function selectNode(id, opts) {
    opts = opts || {};
    const rec = recordOf(id);
    if (!rec) return;
    selectedId = id;

    if (activeCategory !== rec.storeKey) {
      activeCategory = rec.storeKey;
      renderSidebarTree(activeCategory);
    }
    if (activeTab !== rec.storeKey) {
      activeTab = rec.storeKey;
      markActiveTabButton();
    }

    document.querySelectorAll('.node-row.selected').forEach(el => el.classList.remove('selected'));
    expandAncestors(id);
    // a class with multiple superclasses appears once per parent branch, so
    // there can be more than one DOM row for the same id - highlight all of
    // them, but only scroll/flash the first (its ancestor chain is the one
    // expandAncestors() just expanded).
    const rows = document.querySelectorAll('.node-row[data-id="' + id + '"]');
    rows.forEach(r => r.classList.add('selected'));
    const row = rows[0];
    if (row) {
      row.scrollIntoView({ block: 'center' });
      row.parentElement.classList.add('flash');
      setTimeout(() => row.parentElement.classList.remove('flash'), 1400);
    }
    renderDetail(id);
    // record this selection as a browser-history entry (deep-linkable via '#id' too),
    // so the browser's native Back/Forward buttons step through past selections -
    // skipped when we're the ones restoring a state FROM a popstate/deep-link, to
    // avoid pushing a duplicate entry on top of the one already being navigated to.
    if (opts.pushHistory !== false) {
      history.pushState({ id: id }, '', '#' + id);
    }
  }

  function clearContentPanel() {
    document.getElementById('content').innerHTML =
      '<p class="placeholder">Select a class or property from the left, or search above.</p>';
  }

  function clearSelection() {
    selectedId = null;
    document.querySelectorAll('.node-row.selected').forEach(el => el.classList.remove('selected'));
    clearContentPanel();
  }

  window.addEventListener('popstate', (e) => {
    const id = e.state && e.state.id;
    if (id && recordOf(id)) {
      selectNode(id, { pushHistory: false });
    } else {
      clearSelection();
    }
  });

  function chip(text, onClick) {
    const el = document.createElement('span');
    el.className = 'chip' + (onClick ? ' link' : '');
    el.textContent = text;
    if (onClick) el.addEventListener('click', onClick);
    return el;
  }

  // predicateDisplay is shown verbatim (never uppercased, unlike the main
  // label) so it always reads as the actual curie from the ttl, e.g. "skos:altLabel".
  // If it resolves to a browsable tara-ap:/tara-kb: annotation property, it's
  // clickable (jumps to that property's own page) - same tara-native-only
  // restriction as the compact panel's "?" hint badge (predicateHintBadge) -
  // but deliberately not color-coded like a normal link (no accent color),
  // just a pointer cursor and an underline on hover, so it doesn't visually
  // compete with the field's actual value content below it.
  // `below`: render the curie on its own line under the main label instead
  // of inline in parens next to it - for a label whose text already wraps
  // (see acupoints' General/Specific Reference Location).
  function fieldLabel(labelText, predicateDisplay, below) {
    const el = document.createElement('div');
    el.className = 'field-label';
    const main = document.createElement('span');
    main.className = 'fl-main';
    main.textContent = labelText;
    el.appendChild(main);
    if (predicateDisplay) {
      const pred = document.createElement('span');
      pred.className = 'fl-predicate' + (below ? ' below' : '');
      pred.textContent = '(' + predicateDisplay + ')';
      const target = STORES.annotationProperties.records[predicateDisplay];
      if (target) {
        pred.classList.add('clickable');
        pred.addEventListener('click', (e) => { e.stopPropagation(); selectNode(predicateDisplay); });
      }
      el.appendChild(pred);
    }
    return el;
  }

  function divider() {
    const hr = document.createElement('hr');
    hr.className = 'field-divider';
    return hr;
  }

  // Turns any http(s) URL inside a plain-text string into a real link (opens
  // in a new tab), leaving the rest as plain text - used everywhere free text
  // is shown (descriptions, comments, citations, sources, examples, All
  // Annotations values, ...) so a DOI/ORCID/etc. URL is clickable instead of
  // inert text. Builds real DOM nodes (never innerHTML), so it's safe for
  // arbitrary ttl content.
  const URL_RE = /(https?:\/\/[^\s<>"')]+)/g;

  function linkify(text) {
    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    let m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      if (m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      const a = document.createElement('a');
      a.href = m[0];
      a.textContent = m[0];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'ext-link';
      frag.appendChild(a);
      lastIndex = m.index + m[0].length;
    }
    if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    return frag;
  }

  // Detects a plain-text bulleted or numbered list embedded in a value
  // (common in a pasted-in Description/Comment/Example - the ttl literal is
  // just text, it has no real <ul>/<ol> markup of its own) and renders those
  // lines as a real list; everything else is left completely untouched -
  // same text, same line breaks, same everything, just run through linkify()
  // as always. Only a run of 2+ consecutive lines sharing the same marker
  // style counts as a list, so an isolated "- " or "1. " that's actually
  // just part of a sentence doesn't get misread as one.
  // Each captures the marker itself (group 1) separately from the item text
  // (group 2), so the exact marker as written - "(a)", not "a)" or a
  // renumbered "1." - is what ends up on screen; see renderRichText, which
  // prints group 1 back out verbatim instead of asking the browser to
  // generate its own <ol> counter glyph.
  const UL_LINE_RE = /^[ \t]*([-*•])[ \t]+(.*)$/;
  const OL_LINE_RE = /^[ \t]*(\(?\d+[.)])[ \t]+(.*)$/;
  // "(a) ...", "a) ...", "a. ..." (and uppercase) - a single letter marker,
  // same idea as OL_LINE_RE's digits.
  const OL_ALPHA_LINE_RE = /^[ \t]*(\(?[a-zA-Z][.)])[ \t]+(.*)$/;

  function lineMarkerType(line) {
    if (UL_LINE_RE.test(line)) return 'ul';
    if (OL_LINE_RE.test(line)) return 'ol';
    if (OL_ALPHA_LINE_RE.test(line)) return 'ol-alpha';
    return null;
  }

  // The ttl source for these lists (a triple-quoted turtle literal) puts a
  // blank line between each "(a) ...", "(b) ...", "(c) ..." item - normal
  // paragraph-style spacing in the raw text, not a break between separate
  // things. Dropped here (only when sandwiched between two lines with the
  // *same* marker type - never elsewhere) so that blank-line-separated
  // items still group into one list instead of each being read as an
  // isolated, un-listable single line.
  function dropBridgingBlankLines(lines) {
    const out = [];
    let i = 0;
    while (i < lines.length) {
      if (!/^[ \t]*$/.test(lines[i])) { out.push(lines[i]); i++; continue; }
      let j = i;
      while (j < lines.length && /^[ \t]*$/.test(lines[j])) j++;
      const prevType = out.length ? lineMarkerType(out[out.length - 1]) : null;
      const nextType = j < lines.length ? lineMarkerType(lines[j]) : null;
      if (prevType && nextType && prevType === nextType) {
        i = j; // bridges a matching list - drop the blank line(s) entirely
      } else {
        out.push(...lines.slice(i, j));
        i = j;
      }
    }
    return out;
  }

  function classifyLine(line) {
    const ul = line.match(UL_LINE_RE);
    if (ul) return { type: 'ul', marker: ul[1], content: ul[2], raw: line };
    const ol = line.match(OL_LINE_RE);
    if (ol) return { type: 'ol', marker: ol[1], content: ol[2], raw: line };
    const alpha = line.match(OL_ALPHA_LINE_RE);
    if (alpha) return { type: 'ol-alpha', marker: alpha[1], content: alpha[2], raw: line };
    return { type: 'text', content: line, raw: line };
  }

  function groupTextRuns(text) {
    const runs = [];
    dropBridgingBlankLines(text.split('\n')).forEach(line => {
      const item = classifyLine(line);
      const last = runs[runs.length - 1];
      if (last && last.type === item.type) last.items.push(item);
      else runs.push({ type: item.type, items: [item] });
    });
    // a list marker needs 2+ consecutive lines to count as a real list -
    // one matching line on its own is demoted back to plain text (using its
    // original raw text, marker included, unaltered)
    const demoted = runs.map(run => (
      (run.type !== 'text' && run.items.length < 2)
        ? { type: 'text', items: run.items.map(it => ({ type: 'text', content: it.raw })) }
        : run
    ));
    // re-merge adjacent plain-text runs created by that demotion
    const merged = [];
    demoted.forEach(run => {
      const last = merged[merged.length - 1];
      if (last && last.type === 'text' && run.type === 'text') last.items.push(...run.items);
      else merged.push(run);
    });
    return merged;
  }

  function renderRichText(text) {
    const frag = document.createDocumentFragment();
    groupTextRuns(text).forEach(run => {
      if (run.type === 'text') {
        frag.appendChild(linkify(run.items.map(it => it.content).join('\n')));
        return;
      }
      // list-style: none (see CSS) - the marker shown is the exact one from
      // the source line ("(a)", not a browser-generated "a." from <ol
      // type="a">, and not renumbered if the source skipped/repeated one),
      // printed back out verbatim as its own leading span.
      const listEl = document.createElement('ul');
      listEl.className = 'rt-list';
      run.items.forEach(it => {
        const li = document.createElement('li');
        const marker = document.createElement('span');
        marker.className = 'rt-marker';
        marker.textContent = it.marker + ' ';
        // the item's own text is its own flex item (see .rt-list li), not
        // loose nodes straight in the <li> - a wrapped line then aligns
        // under this element's own left edge (right after the marker's
        // actual width, whatever that is) instead of under a fixed guess
        // that's wrong for every marker width but one.
        const textEl = document.createElement('span');
        textEl.className = 'rt-item-text';
        textEl.appendChild(linkify(it.content));
        li.appendChild(marker);
        li.appendChild(textEl);
        listEl.appendChild(li);
      });
      frag.appendChild(listEl);
    });
    return frag;
  }

  function prose(text) {
    const el = document.createElement('div');
    el.className = 'prose';
    el.appendChild(renderRichText(text));
    return el;
  }

  // Renders propIds (a flat list of property ids sharing one domain class) as a
  // nested tree following the curated Annotation Properties hierarchy, instead of
  // one flat chip list - grouping properties (e.g. "Category B: ...") show their
  // members nested underneath instead of as unrelated siblings. An ancestor that
  // isn't itself in propIds (its own domain differs or is unset) is still shown,
  // dimmed, purely as structural connective tissue to the nearest visible root.
  function buildDomainTree(propIds) {
    const PROPERTIES = STORES.annotationProperties.records;
    const include = new Set(propIds);
    const connectors = new Set();
    include.forEach(id => {
      let cur = PROPERTIES[id] ? PROPERTIES[id].parent : null;
      while (cur && !include.has(cur) && !connectors.has(cur)) {
        connectors.add(cur);
        cur = PROPERTIES[cur] ? PROPERTIES[cur].parent : null;
      }
    });
    const all = new Set([...include, ...connectors]);
    const roots = [...all]
      .filter(id => { const p = PROPERTIES[id].parent; return !p || !all.has(p); })
      .sort((a, b) => PROPERTIES[a].label.localeCompare(PROPERTIES[b].label));

    function renderNode(id) {
      const rec = PROPERTIES[id];
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'node-row' + (rec.grouping ? ' grouping' : '') + (connectors.has(id) ? ' connector' : '');
      row.dataset.id = id;
      if (connectors.has(id)) row.title = 'Shown for structure only — its own domain differs from this class';
      const bullet = document.createElement('span');
      bullet.className = 'toggle leaf';
      bullet.textContent = '-';
      row.appendChild(bullet);
      const label = document.createElement('span');
      label.className = 'node-label';
      label.textContent = rec.label;
      row.appendChild(label);
      row.addEventListener('click', () => selectNode(id));
      li.appendChild(row);

      const children = (rec.children || [])
        .filter(cid => all.has(cid))
        .sort((a, b) => PROPERTIES[a].label.localeCompare(PROPERTIES[b].label));
      if (children.length) {
        const ul = document.createElement('ul');
        children.forEach(cid => ul.appendChild(renderNode(cid)));
        li.appendChild(ul);
      }
      return li;
    }

    const container = document.createElement('div');
    container.className = 'tree domain-tree';
    const ul = document.createElement('ul');
    roots.forEach(rid => ul.appendChild(renderNode(rid)));
    container.appendChild(ul);
    return container;
  }

  function badgeText(rec) {
    if (rec.kind === 'class') return 'Class';
    if (rec.kind === 'datatype') return 'Data Type';
    if (rec.kind === 'objectProperty') return rec.grouping ? 'Grouping Object Property' : 'Object Property';
    return rec.grouping ? 'Grouping Property' : 'Property';
  }

  // One segment of the top cluster row: a type-badge-style label ("Property",
  // "Domain", "Range", ...) paired with a qname-badge-style value, the same
  // visual pairing used for the record's own kind+id segment - so Domain/Range
  // read as more of the same cluster rather than a different kind of widget.
  function typeBadge(text) {
    const el = document.createElement('span');
    el.className = 'type-badge';
    el.textContent = text;
    return el;
  }

  function valueBadge(text, onClick) {
    const el = document.createElement('span');
    el.className = 'qname-badge' + (onClick ? ' link' : '');
    el.textContent = text;
    if (onClick) el.addEventListener('click', onClick);
    return el;
  }

  function clusterSeg(labelText, valueText, onClick) {
    const seg = document.createElement('div');
    seg.className = 'dc-seg';
    seg.appendChild(typeBadge(labelText));
    seg.appendChild(valueBadge(valueText, onClick));
    return seg;
  }

  // Domain/Range render as a column to the right of the Property/label
  // column, separated by one faint vertical line spanning both rows: Domain
  // lines up with the Property row, Range lines up with the main label row -
  // each badge styled exactly like the Property segment's badges. This is a
  // 2-column CSS grid (not stacked clusterSeg rows) so the label column
  // width is just whichever of "Domain"/"Range" is naturally wider, and the
  // value pills in column 2 line up on their left edge without stretching
  // or centering the labels themselves. Not part of the main DETAIL_FIELDS
  // sequence, so built directly in renderDetail().
  function buildDomainRangeSideCol(rec) {
    // Respects selection: if a per-ontology DETAIL_FIELDS list drops the
    // "domain_range" entry entirely, this section doesn't render even when
    // the record has a domain/range.
    if (!activeFields(fieldsFor(rec)).some(f => f.key === 'domain_range')) return null;
    const hasDomain = !!rec.domain;
    const hasRange = rec.range && rec.range.label;
    if (!hasDomain && !hasRange) return null;

    const col = document.createElement('div');
    col.className = 'detail-header-side';

    col.appendChild(typeBadge('Domain'));
    col.appendChild(hasDomain ? valueBadge(rec.domainLabel, curieClickHandler(rec.domain)) : valueBadge('not specified'));

    let rangeVal = 'not specified';
    let rangeClick = null;
    if (rec.range && (rec.range.kind === 'class' || rec.range.kind === 'datatype')) {
      rangeVal = rec.range.label;
      rangeClick = curieClickHandler(rec.range.id);
    } else if (hasRange) {
      rangeVal = rec.range.label;
    }
    col.appendChild(typeBadge('Range'));
    col.appendChild(valueBadge(rangeVal, rangeClick));

    return col;
  }

  function renderProseField(content, rec, f) {
    const val = rec[f.key];
    if (!val) return false;
    content.appendChild(fieldLabel(f.label, f.predicateDisplay));
    content.appendChild(prose(val));
    return true;
  }

  function renderExamplesField(content, rec, f) {
    const vals = rec[f.key];
    if (!vals || !vals.length) return false;
    content.appendChild(fieldLabel(f.label, f.predicateDisplay));
    vals.forEach(ex => {
      const block = document.createElement('div');
      block.className = 'example-block';
      block.appendChild(renderRichText(ex));
      content.appendChild(block);
    });
    return true;
  }

  // Like renderExamplesField, but each entry is a plain block (no border/
  // background box) with a faint divider line between entries instead -
  // used for citation/source, where multiple full-length references read
  // better as a simple divided list than as boxed callouts.
  // A configured text_list/text_list_row field's values are plain strings
  // (from list_of()); a discovered one's are {label, id} objects (from
  // extract_entity_values(), id always null here - a predicate only gets
  // render="text_list_row" when nothing it ever pointed at resolved as an
  // entity) - accept either so this doesn't care which kind of field called it.
  function valueLabel(v) {
    return typeof v === 'string' ? v : v.label;
  }

  function renderTextListField(content, rec, f) {
    const vals = rec[f.key];
    if (!vals || !vals.length) return false;
    content.appendChild(fieldLabel(f.label, f.predicateDisplay));
    const wrap = document.createElement('div');
    wrap.className = 'text-list';
    vals.forEach(v => {
      const block = document.createElement('div');
      block.className = 'text-list-item';
      block.appendChild(renderRichText(valueLabel(v)));
      wrap.appendChild(block);
    });
    content.appendChild(wrap);
    return true;
  }

  // A list of {label, id} values (render="entity_list") - each becomes a
  // clickable pill when its id resolves to a real record (an actual
  // ontology entity); a non-clickable pill when f.alwaysPill (a discovered
  // field - every value is the same short token-like shape, e.g. a database
  // cross-reference code, whether or not that particular one happens to
  // resolve); plain (linkified) text otherwise - same convention as the
  // compact panel's buildAnnValueNode(), so a configured field's genuine
  // descriptive fallback text (e.g. acupoints' General/Specific Surface
  // Location, Related Artery/Vein) doesn't look like an entity reference
  // just because it shares a field with ones that are.
  function renderEntityListField(content, rec, f) {
    const vals = rec[f.key];
    if (!vals || !vals.length) return false;
    content.appendChild(fieldLabel(f.label, f.predicateDisplay, f.predicateBelow));
    const row = document.createElement('div');
    row.className = 'chip-row';
    vals.forEach(v => {
      const target = v.id ? recordOf(v.id) : null;
      if (target) {
        row.appendChild(chip(v.label, () => selectNode(v.id)));
      } else if (f.alwaysPill) {
        row.appendChild(chip(v.label));
      } else {
        const span = document.createElement('span');
        span.className = 'ann-val-plain';
        span.appendChild(linkify(v.label));
        row.appendChild(span);
      }
    });
    content.appendChild(row);
    return true;
  }

  function renderDatatypeExprField(content, rec, f) {
    const tokens = rec[f.key];
    if (!tokens || !tokens.length) return false;
    content.appendChild(fieldLabel(f.label, f.predicateDisplay));
    const box = document.createElement('div');
    box.className = 'dtexpr';
    tokens.forEach(tok => {
      const span = document.createElement('span');
      span.className = 'dtx-' + tok.t;
      span.textContent = tok.v;
      box.appendChild(span);
    });
    content.appendChild(box);
    return true;
  }

  function renderNavSingleField(content, rec, f) {
    const store = STORES[rec.storeKey].records;
    // classes can have more than one named superclass (real multiple
    // inheritance, e.g. an acupoint that's both a meridian point and a
    // Shu-Stream point) - show every one that resolved to an actual record,
    // not just the first (rec.parent/rec.parents both point at the same
    // underlying data; parents is the complete list where present).
    const parentIds = (rec.parents && rec.parents.length ? rec.parents : (rec.parent ? [rec.parent] : []))
      .filter(pid => store[pid]);
    if (!parentIds.length) return false;
    const label = rec.kind === 'class' ? f.labelClass : f.labelProperty;
    const predDisplay = rec.kind === 'class' ? f.predicateDisplayClass : f.predicateDisplayProperty;
    content.appendChild(fieldLabel(label, predDisplay));
    const row = document.createElement('div');
    row.className = 'chip-row';
    parentIds.forEach(pid => row.appendChild(chip(store[pid].label, () => selectNode(pid))));
    content.appendChild(row);
    return true;
  }

  function renderNavMultiField(content, rec, f) {
    if (!rec.children || !rec.children.length) return false;
    const store = STORES[rec.storeKey].records;
    const label = rec.kind === 'class' ? f.labelClass : f.labelProperty;
    const predDisplay = rec.kind === 'class' ? f.predicateDisplayClass : f.predicateDisplayProperty;
    content.appendChild(fieldLabel(label, predDisplay));
    const row = document.createElement('div');
    row.className = 'chip-row';
    rec.children.forEach(cid => row.appendChild(chip(store[cid].label, () => selectNode(cid))));
    content.appendChild(row);
    return true;
  }

  // One compact row: a field-label-styled predicate cell (main label in caps
  // on top, the predicate curie in braces on its own line below - same
  // fl-main/fl-predicate styling as the structured panel's field labels,
  // just stacked instead of inline) next to its value(s).
  // A small "?" badge next to a compact-mode field label: hovering it shows
  // the predicate curie (native title tooltip); if the predicate is itself a
  // tara-ap: annotation property with a browsable record, the badge is also
  // clickable, jumping to that property's own page. Other namespaces
  // (dcterms:, rdfs:, skos:, obo:, IAO:, OboInOwl:, ...) get the hover only -
  // navigation is intentionally restricted to this ontology ecosystem's own
  // annotation-property namespace.
  function predicateHintBadge(predicateDisplay) {
    if (!predicateDisplay) return null;
    // only shown for this ontology ecosystem's own predicate namespaces -
    // dcterms:/rdfs:/skos:/obo:/IAO:/OboInOwl:/etc. predicates get the plain
    // hover tooltip on the label (set in annRow()) but no badge at all.
    const isTaraNative = predicateDisplay.startsWith('tara-ap:') || predicateDisplay.startsWith('tara-kb:');
    if (!isTaraNative) return null;
    const badge = document.createElement('span');
    badge.className = 'pred-hint';
    badge.textContent = '?';
    // no title here - the tooltip is set on the whole label cell (ann-pred)
    // instead, so hovering the label text shows it immediately, not just
    // this small badge; the badge's own job is just the click-to-navigate.
    const target = STORES.annotationProperties.records[predicateDisplay];
    if (target) {
      badge.classList.add('link');
      badge.addEventListener('click', (e) => { e.stopPropagation(); selectNode(predicateDisplay); });
    }
    return badge;
  }

  function buildAnnPredCell(labelText, predicateDisplay, tight) {
    const predCell = document.createElement('div');
    predCell.className = 'ann-pred' + (tight ? ' tight' : '');
    // the predicate curie is a hover tooltip here, not shown inline (unlike
    // the structured panel's field labels) - keeps each dense row to one
    // line; hovering anywhere over the label shows it right away, while the
    // "?" badge fades in for click-to-navigate (tara-ap:/tara-kb: only)
    if (predicateDisplay) predCell.title = predicateDisplay;
    const labelEl = fieldLabel(labelText, null);
    const hint = predicateHintBadge(predicateDisplay);
    if (hint) labelEl.appendChild(hint);
    predCell.appendChild(labelEl);
    return predCell;
  }

  // valueInfo is {kind:'text', text}, {kind:'entities', values:[{label,id}], alwaysPill}
  // or {kind:'divided_list', ...} - an entities value becomes a clickable
  // pill when its id actually resolves to a real record, a non-clickable
  // pill when alwaysPill is set (a discovered field - every value is the
  // same short token-like shape whether or not it happens to resolve), or
  // otherwise plain text (a configured field's genuine descriptive fallback
  // text, not actually an entity reference - see renderEntityListField).
  function buildAnnValueNode(valueInfo) {
    if (valueInfo.kind === 'entities') {
      const wrap = document.createElement('span');
      wrap.className = 'ann-vals ann-vals-mixed';
      valueInfo.values.forEach(v => {
        const target = v.id ? recordOf(v.id) : null;
        if (target) {
          wrap.appendChild(chip(v.label, () => selectNode(v.id)));
        } else if (valueInfo.alwaysPill) {
          wrap.appendChild(chip(v.label));
        } else {
          const span = document.createElement('span');
          span.className = 'ann-val-plain';
          span.appendChild(linkify(v.label));
          wrap.appendChild(span);
        }
      });
      return wrap;
    }
    if (valueInfo.kind === 'divided_list') {
      // multiple entries within one row's value cell, each on its own line
      // (ann-val-entry is display:block, so it wraps like a <br> would),
      // with a faint divider between entries - not a single "|"-joined line.
      const wrap = document.createElement('div');
      wrap.className = 'ann-vals';
      valueInfo.values.forEach(v => {
        const entry = document.createElement('div');
        entry.className = 'ann-val-entry';
        entry.appendChild(renderRichText(valueLabel(v)));
        wrap.appendChild(entry);
      });
      return wrap;
    }
    const wrap = document.createElement('div');
    wrap.className = 'ann-vals';
    wrap.appendChild(renderRichText(valueInfo.text));
    return wrap;
  }

  function annRowSingle(table, labelText, predicateDisplay, valueInfo, tight) {
    const rowEl = document.createElement('div');
    rowEl.className = 'ann-row';
    rowEl.appendChild(buildAnnPredCell(labelText, predicateDisplay, tight));
    rowEl.appendChild(buildAnnValueNode(valueInfo));
    table.appendChild(rowEl);
  }

  // items: [{labelText, predicateDisplay, valueInfo, tight}, ...] sharing one
  // line, each in its own column - the compact-mode counterpart of the
  // structured panel's detail-pair-row for line_group-paired fields.
  function annRowPaired(table, items) {
    const rowEl = document.createElement('div');
    rowEl.className = 'ann-row ann-row-paired';
    items.forEach(item => {
      const col = document.createElement('div');
      col.className = 'ann-pair-item';
      col.appendChild(buildAnnPredCell(item.labelText, item.predicateDisplay, item.tight));
      col.appendChild(buildAnnValueNode(item.valueInfo));
      rowEl.appendChild(col);
    });
    table.appendChild(rowEl);
  }

  const FIELD_RENDERERS = {
    prose: renderProseField,
    examples: renderExamplesField,
    text_list: renderTextListField,
    text_list_row: renderTextListField, // structured mode: identical to text_list; compact mode: see COMPACT_FULL_WIDTH_RENDERS
    datatype_expr: renderDatatypeExprField,
    nav_single: renderNavSingleField,
    nav_multi: renderNavMultiField,
    entity_list: renderEntityListField,
  };

  // Any field whose render type isn't in FIELD_RENDERERS above (domain_range,
  // identity_pill) is handled specially by renderDetailHeader() instead of the
  // sequential per-style loops - this falls out naturally rather than needing
  // a separate key list, so a per-ontology script can add new identity_pill
  // fields (e.g. acupoints' Pinyin/Chinese Label, Acronym) without touching
  // any JS: they show up in the shared header row automatically.

  function fieldLabelFor(rec, f) {
    return f.label || (rec.kind === 'class' ? f.labelClass : f.labelProperty);
  }
  function predicateDisplayFor(rec, f) {
    return f.predicateDisplay || (rec.kind === 'class' ? f.predicateDisplayClass : f.predicateDisplayProperty);
  }

  // The header (Property/Class badge + qname, Domain/Range, and the identity
  // row of pill fields) is identical for both detail-panel styles - only
  // what renders below it differs (see renderDetailStructured/Compact).
  function renderDetailHeader(content, rec) {
    const header = document.createElement('div');
    header.className = 'detail-header';

    const mainCol = document.createElement('div');
    mainCol.className = 'detail-header-main';
    const kindRow = document.createElement('div');
    kindRow.className = 'dc-row';
    kindRow.appendChild(clusterSeg(badgeText(rec), rec.id, curieClickHandler(rec.id)));
    mainCol.appendChild(kindRow);
    const h = document.createElement('h2');
    h.textContent = rec.label;
    mainCol.appendChild(h);
    header.appendChild(mainCol);

    const sideCol = buildDomainRangeSideCol(rec);
    if (sideCol) header.appendChild(sideCol);

    content.appendChild(header);

    buildIdentityRows(rec).forEach(row => content.appendChild(row));
  }

  // Every DETAIL_FIELDS entry tagged render:'identity_pill' (Synonyms, Alt
  // Label, and whatever a per-ontology script appends - e.g. acupoints' Pinyin
  // Label/Chinese Label/Acronym) becomes one column in the header's identity
  // block, each shown only if it has a value. A field whose value is an array
  // (like synonyms) gets one pill per item; a single value gets one pill.
  // Fields are grouped into separate lines by their identityRow (ascending),
  // and appear left-to-right within a line in DETAIL_FIELDS list order - so
  // a per-ontology script can put e.g. Pinyin/Chinese Label on their own
  // first line and Synonyms/Alt Label/Acronym on a second line below.
  // The identity row's own field label - inline curie in structured mode
  // (like any other field label), but the same hover-tooltip + "?" badge
  // convention as every other compact-mode field label when this record's
  // kind is displayed compact (no visible curie text, consistent with the
  // rest of the compact panel).
  function identityFieldLabel(f, rec) {
    if (PANEL_STYLE[rec.storeKey] === 'compact') {
      const el = fieldLabel(f.label, null);
      if (f.predicateDisplay) el.title = f.predicateDisplay;
      const hint = predicateHintBadge(f.predicateDisplay);
      if (hint) el.appendChild(hint);
      return el;
    }
    return fieldLabel(f.label, f.predicateDisplay);
  }

  function buildIdentityRows(rec) {
    const rowsByIndex = new Map(); // identityRow -> [colEl, ...]
    activeFields(fieldsFor(rec)).filter(f => f.render === 'identity_pill').forEach(f => {
      const val = f.key === 'synonyms' ? rec.synonyms : rec[f.key];
      const items = Array.isArray(val) ? val : (val ? [val] : []);
      if (!items.length) return;
      const col = document.createElement('div');
      col.className = 'detail-pair-col';
      col.appendChild(identityFieldLabel(f, rec));
      const chips = document.createElement('div');
      chips.className = 'chip-row';
      items.forEach(v => chips.appendChild(chip(v)));
      col.appendChild(chips);
      const idx = f.identityRow || 0;
      if (!rowsByIndex.has(idx)) rowsByIndex.set(idx, []);
      rowsByIndex.get(idx).push(col);
    });
    return [...rowsByIndex.keys()].sort((a, b) => a - b).map(idx => {
      const wrap = document.createElement('div');
      wrap.className = 'detail-pair-row';
      rowsByIndex.get(idx).forEach(c => wrap.appendChild(c));
      return wrap;
    });
  }

  function appendCrossReferenceSections(content, rec) {
    if (rec.kind === 'class' && rec.propertiesWithThisDomain && rec.propertiesWithThisDomain.length) {
      content.appendChild(fieldLabel('Properties with this Domain'));
      content.appendChild(buildDomainTree(rec.propertiesWithThisDomain));
    }
    if (rec.kind === 'datatype' && rec.propertiesUsingThisType && rec.propertiesUsingThisType.length) {
      content.appendChild(fieldLabel('Properties Using This Datatype'));
      content.appendChild(buildDomainTree(rec.propertiesUsingThisType));
    }
  }

  // Groups a field list into render units: fields sharing the same non-null
  // lineGroup become one unit (rendered side by side on one line); every
  // other field is its own single-field unit. Preserves first-appearance
  // order. Shared by both detail-panel styles.
  function groupFieldsByLine(fields) {
    const groups = [];
    const byKey = new Map();
    fields.forEach(f => {
      if (!f.lineGroup) { groups.push([f]); return; }
      if (byKey.has(f.lineGroup)) {
        byKey.get(f.lineGroup).push(f);
      } else {
        const group = [f];
        byKey.set(f.lineGroup, group);
        groups.push(group);
      }
    });
    return groups;
  }

  function renderDetailStructured(content, rec) {
    const fields = activeFields(fieldsFor(rec)).filter(f => FIELD_RENDERERS[f.render]);
    let renderedAny = false;
    groupFieldsByLine(fields).forEach(group => {
      // a faint line before Parent/Superclass, separating the hierarchy nav
      // (always last) from everything else - only if something else actually
      // rendered above it, so an entity with nothing but Parent/Children
      // doesn't start with a stray divider
      if (group.length === 1 && group[0].key === 'parent' && renderedAny) {
        content.appendChild(divider());
      }
      if (group.length === 1) {
        const f = group[0];
        if (FIELD_RENDERERS[f.render](content, rec, f)) renderedAny = true;
        return;
      }
      // paired/grouped fields render into their own column, side by side -
      // a field that has nothing to show simply contributes no column
      const row = document.createElement('div');
      row.className = 'detail-pair-row';
      group.forEach(f => {
        const col = document.createElement('div');
        col.className = 'detail-pair-col';
        if (FIELD_RENDERERS[f.render](col, rec, f)) row.appendChild(col);
      });
      if (row.children.length) { content.appendChild(row); renderedAny = true; }
    });
    appendCrossReferenceSections(content, rec);
  }

  // Returns a valueInfo ({kind:'text',text} or {kind:'entities',values}) for
  // a dense label/value row - used when detail_panel_style is "compact".
  // domain_range/identity_pill (in the shared header) and parent/children
  // render elsewhere entirely - see renderDetailCompact() below.
  function compactValueInfo(rec, f) {
    if (f.render === 'prose') {
      return rec[f.key] ? { kind: 'text', text: rec[f.key] } : null;
    }
    if (f.render === 'examples') {
      // divided_list, not a '|'-joined single string - joining would merge
      // multiple distinct example values into one blended string that
      // doesn't exist anywhere in the ttl; each stays intact, on its own
      // line, exactly as asserted (see buildAnnValueNode's "divided_list" kind).
      return (rec[f.key] && rec[f.key].length) ? { kind: 'divided_list', values: rec[f.key] } : null;
    }
    if (f.render === 'datatype_expr') {
      return (rec[f.key] && rec[f.key].length) ? { kind: 'text', text: rec[f.key].map(t => t.v).join('') } : null;
    }
    if (f.render === 'entity_list') {
      return (rec[f.key] && rec[f.key].length) ? { kind: 'entities', values: rec[f.key], alwaysPill: !!f.alwaysPill } : null;
    }
    if (f.render === 'text_list_row') {
      return (rec[f.key] && rec[f.key].length) ? { kind: 'divided_list', values: rec[f.key] } : null;
    }
    return null;
  }

  // Render types that always use their full FIELD_RENDERERS widget - even in
  // compact mode - because squeezing them onto one dense row would defeat
  // the point (e.g. text_list's whole point is multiple clearly-divided
  // blocks, not a single "|"-joined line). Rendered inline, at this field's
  // normal position in the field order, not pulled out to the end.
  const COMPACT_FULL_WIDTH_RENDERS = new Set(['text_list']);

  function renderDetailCompact(content, rec) {
    let table = null;
    let renderedAny = false;
    function ensureTable() {
      if (!table) {
        table = document.createElement('div');
        table.className = 'ann-table';
      }
      return table;
    }
    function flushTable() {
      if (table && table.children.length) { content.appendChild(table); renderedAny = true; }
      table = null;
    }

    const compactFields = activeFields(fieldsFor(rec)).filter(f =>
      f.render !== 'nav_single' && f.render !== 'nav_multi'
    );
    groupFieldsByLine(compactFields).forEach(group => {
      // dividerBefore only applies to single-field groups (see DetailField -
      // Citation is the current use, following Source, a
      // COMPACT_FULL_WIDTH_RENDERS field that flushes/closes its own table)
      const wantsDividerBefore = group.length === 1 && group[0].dividerBefore;
      if (group.length === 1 && COMPACT_FULL_WIDTH_RENDERS.has(group[0].render)) {
        if (wantsDividerBefore && renderedAny) { flushTable(); content.appendChild(divider()); }
        flushTable();
        if (FIELD_RENDERERS[group[0].render](content, rec, group[0])) renderedAny = true;
        return;
      }
      const items = group
        .map(f => ({ f, valueInfo: compactValueInfo(rec, f) }))
        .filter(item => item.valueInfo);
      if (!items.length) return;
      if (wantsDividerBefore && renderedAny) { flushTable(); content.appendChild(divider()); }
      if (items.length === 1) {
        annRowSingle(ensureTable(), fieldLabelFor(rec, items[0].f), predicateDisplayFor(rec, items[0].f), items[0].valueInfo, !!items[0].f.compactTightPred);
      } else {
        annRowPaired(ensureTable(), items.map(item => ({
          labelText: fieldLabelFor(rec, item.f),
          predicateDisplay: predicateDisplayFor(rec, item.f),
          valueInfo: item.valueInfo,
          tight: !!item.f.compactTightPred,
        })));
      }
    });
    flushTable();

    // Parent/Superclass and Sub-properties/Subclasses always render as the
    // same structured nav-chip widgets used in "structured" mode, at the very
    // bottom - not as compact rows - with a faint divider above them if
    // anything else on the panel already rendered.
    const fields = activeFields(fieldsFor(rec));
    const parentField = fields.find(x => x.key === 'parent');
    const childrenField = fields.find(x => x.key === 'children');
    if (renderedAny && ((parentField && rec.parents && rec.parents.length) || (parentField && rec.parent) || (childrenField && rec.children && rec.children.length))) {
      content.appendChild(divider());
    }
    if (parentField) FIELD_RENDERERS[parentField.render](content, rec, parentField);
    if (childrenField) FIELD_RENDERERS[childrenField.render](content, rec, childrenField);

    appendCrossReferenceSections(content, rec);
  }

  // One style per hierarchy tab (classes/annotationProperties/objectProperties/
  // dataTypes) - all start at the ttl's configured default (optionally
  // already different per kind, see OntologyDocConfig.detail_panel_style),
  // independently overridable from the settings panel. Summary has no style
  // of its own (it's not field-list-driven), so it's not a key here.
  const PANEL_STYLE = Object.assign({}, DATA.detailPanelStyleByKind);

  function renderDetail(id) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const rec = recordOf(id);
    if (!rec) { content.innerHTML = '<p class="placeholder">Not found.</p>'; return; }

    renderDetailHeader(content, rec);
    if (PANEL_STYLE[rec.storeKey] === 'compact') {
      renderDetailCompact(content, rec);
    } else {
      renderDetailStructured(content, rec);
    }
  }

  // ---- Summary tab ----
  // Summary-row valueInfo, in the same {kind, text|values} shape
  // buildAnnValueNode() (compact mode) already knows how to render.
  function summaryValueInfo(row) {
    if (row.mode === 'single') return { kind: 'text', text: row.value };
    return { kind: 'divided_list', values: row.values }; // multi_block / multi_br: one entry per line either way in compact mode
  }

  function renderSummaryStructured(content) {
    activeFields(SUMMARY_FIELDS).forEach(row => {
      const wrap = document.createElement('div');
      wrap.className = 'summary-row';
      wrap.appendChild(fieldLabel(row.label, row.predicateDisplay));
      if (row.mode === 'single') {
        wrap.appendChild(prose(row.value));
      } else if (row.mode === 'multi_block') {
        row.values.forEach(v => wrap.appendChild(prose(v)));
      } else if (row.mode === 'multi_br') {
        const el = document.createElement('div');
        el.className = 'prose';
        row.values.forEach((v, i) => {
          if (i > 0) el.appendChild(document.createElement('br'));
          el.appendChild(linkify(v));
        });
        wrap.appendChild(el);
      }
      content.appendChild(wrap);
    });
  }

  function renderSummaryCompact(content) {
    const table = document.createElement('div');
    table.className = 'ann-table';
    activeFields(SUMMARY_FIELDS).forEach(row => {
      annRowSingle(table, row.label, row.predicateDisplay, summaryValueInfo(row));
    });
    if (table.children.length) content.appendChild(table);
  }

  function renderSummary() {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const h = document.createElement('h2');
    h.textContent = 'Ontology Summary';
    content.appendChild(h);

    if (PANEL_STYLE.summary === 'compact') renderSummaryCompact(content);
    else renderSummaryStructured(content);
  }

  // ---- search / autocomplete / filter ----
  const searchInput = document.getElementById('search');
  const autocompleteEl = document.getElementById('autocomplete');
  let acItems = [];
  let acActiveIndex = -1;

  function searchableText(rec) {
    return [rec.label, rec.altLabel].concat(rec.synonyms || [])
      .filter(Boolean).join(' • ').toLowerCase();
  }

  function allEntries() {
    const all = [];
    Object.values(STORES).forEach(s => all.push(...Object.values(s.records)));
    all.sort((a, b) => a.label.localeCompare(b.label));
    return all;
  }

  function matchIds(query) {
    const q = query.trim().toLowerCase();
    if (!q) return allEntries(); // empty query -> full pulldown of everything, browsable
    const results = allEntries().filter(rec => searchableText(rec).includes(q));
    return results;
  }

  function ancestorChain(id) {
    const chain = [];
    const rec = recordOf(id);
    if (!rec) return chain;
    const store = STORES[rec.storeKey].records;
    let cur = rec.parent;
    while (cur) { chain.push(cur); cur = store[cur] ? store[cur].parent : null; }
    return chain;
  }

  function applyFilter(query) {
    const matches = matchIds(query);
    const allTreeItems = document.querySelectorAll('#sidebar-tree li');
    if (!query.trim()) {
      allTreeItems.forEach(li => li.classList.remove('hidden-by-filter'));
      autoFitSidebarWidth();
      return;
    }
    const keep = new Set();
    matches.filter(rec => rec.storeKey === activeCategory).forEach(rec => {
      keep.add(rec.id);
      ancestorChain(rec.id).forEach(a => keep.add(a));
    });
    allTreeItems.forEach(li => {
      li.classList.toggle('hidden-by-filter', !keep.has(li.dataset.id));
    });
    keep.forEach(id => {
      const row = document.querySelector('.node-row[data-id="' + id + '"]');
      if (row) {
        const ul = row.parentElement.querySelector(':scope > ul');
        if (ul) {
          ul.style.display = '';
          const t = row.querySelector('.toggle');
          if (t && !t.classList.contains('leaf')) t.textContent = TOGGLE_EXPANDED;
        }
      }
    });
    autoFitSidebarWidth();
  }

  function renderAutocomplete(query) {
    acItems = matchIds(query).slice(0, 60);
    acActiveIndex = -1;
    autocompleteEl.innerHTML = '';
    if (acItems.length === 0) {
      autocompleteEl.style.display = 'none';
      return;
    }
    acItems.forEach((rec, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item';
      item.dataset.index = i;
      const badge = document.createElement('span');
      badge.className = 'ac-badge';
      badge.textContent = badgeText(rec);
      item.appendChild(badge);
      const label = document.createElement('span');
      label.textContent = rec.label;
      item.appendChild(label);
      item.addEventListener('mousedown', (e) => { e.preventDefault(); chooseAutocomplete(i); });
      autocompleteEl.appendChild(item);
    });
    // #autocomplete's stylesheet rule defaults to display:none, so clearing the
    // inline style here (display = '') would fall back to that and stay hidden -
    // must set an explicit visible value instead.
    autocompleteEl.style.display = 'block';
  }

  function chooseAutocomplete(i) {
    const rec = acItems[i];
    if (!rec) return;
    searchInput.value = rec.label;
    autocompleteEl.style.display = 'none';
    applyFilter('');
    selectNode(rec.id);
  }

  searchInput.addEventListener('input', () => {
    applyFilter(searchInput.value);
    renderAutocomplete(searchInput.value);
  });

  searchInput.addEventListener('focus', () => renderAutocomplete(searchInput.value));
  searchInput.addEventListener('click', () => renderAutocomplete(searchInput.value));

  searchInput.addEventListener('keydown', (e) => {
    if (autocompleteEl.style.display === 'none') return;
    const rows = autocompleteEl.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      acActiveIndex = Math.min(acActiveIndex + 1, rows.length - 1);
      rows.forEach((r, i) => r.classList.toggle('active', i === acActiveIndex));
      rows[acActiveIndex] && rows[acActiveIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      acActiveIndex = Math.max(acActiveIndex - 1, 0);
      rows.forEach((r, i) => r.classList.toggle('active', i === acActiveIndex));
      rows[acActiveIndex] && rows[acActiveIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      chooseAutocomplete(acActiveIndex >= 0 ? acActiveIndex : 0);
    } else if (e.key === 'Escape') {
      autocompleteEl.style.display = 'none';
    }
  });

  document.addEventListener('click', (e) => {
    if (!autocompleteEl.contains(e.target) && e.target !== searchInput) {
      autocompleteEl.style.display = 'none';
    }
  });

  // ---- display settings ----
  // The panel itself is maintainer-only (see isMaintainerMode() below), but
  // a "locked" default config - once set - applies to every viewer, since
  // that's the whole point of locking one in. Everything here is a thin
  // control layer over state the rest of the page already reads live
  // (DEFAULT_EXPANDED_DEPTH, DETAIL_FIELDS_BY_KIND/SUMMARY_FIELDS order +
  // __hidden flags, PANEL_STYLE per kind) - changing it here and re-invoking
  // the normal render functions is enough, no separate code path.
  const SETTINGS_KEY = 'taraDocSettings:' + location.pathname;      // this viewer's own live override, if they've opened the panel
  const LOCKED_KEY = 'taraDocSettingsLocked:' + location.pathname;  // the maintainer's "default for everyone" snapshot, if any
  const MAINTAINER_FLAG_KEY = 'taraDocMaintainerMode';              // not path-namespaced - granted once, applies across every ontology page on this site

  // A visitor is only in maintainer mode if the URL says so (?settings=1),
  // or they were granted it that way on a previous visit (persisted so the
  // link only has to be used once). This is presentation-layer gating for
  // keeping the control out of ordinary readers' way, not real access
  // control - anyone who learns the URL parameter or reads this script can
  // still reach it, and it only ever affects that person's own browser.
  function isMaintainerMode() {
    try {
      const params = new URLSearchParams(location.search);
      if (params.get('settings') === '1') {
        localStorage.setItem(MAINTAINER_FLAG_KEY, '1');
        return true;
      }
      return localStorage.getItem(MAINTAINER_FLAG_KEY) === '1';
    } catch (e) {
      return new URLSearchParams(location.search).get('settings') === '1';
    }
  }

  function fieldDisplayName(f) {
    return f.label || f.labelClass || f.labelProperty || f.key;
  }

  function currentSettingsSnapshot() {
    const detailFieldsByKind = {};
    Object.keys(DETAIL_FIELDS_BY_KIND).forEach(k => {
      detailFieldsByKind[k] = DETAIL_FIELDS_BY_KIND[k].map(f => ({ key: f.key, hidden: !!f.__hidden }));
    });
    return {
      expandedDepth: DEFAULT_EXPANDED_DEPTH,
      panelStyle: Object.assign({}, PANEL_STYLE),
      detailFieldsByKind: detailFieldsByKind,
      summaryFields: SUMMARY_FIELDS.map(r => ({ key: r.label, hidden: !!r.__hidden })),
    };
  }

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(currentSettingsSnapshot())); } catch (e) { /* unavailable (private mode, quota, ...) - just won't persist */ }
  }

  // Reorders `items` (in place) to match the key order recorded in `saved`,
  // and applies each saved item's hidden flag - any item not mentioned in
  // `saved` (e.g. a field added to this ttl's config since the settings were
  // last saved) keeps its default position, appended after the known ones.
  function applyOrderAndVisibility(items, saved, getKey) {
    if (!saved || !saved.length) return;
    const byKey = new Map(items.map(item => [getKey(item), item]));
    const reordered = [];
    saved.forEach(s => {
      const item = byKey.get(s.key);
      if (item) { item.__hidden = !!s.hidden; reordered.push(item); byKey.delete(s.key); }
    });
    byKey.forEach(item => reordered.push(item)); // anything unseen keeps default relative order, appended at the end
    items.length = 0;
    items.push(...reordered);
  }

  function applySnapshot(saved) {
    if (!saved) return;
    if (typeof saved.expandedDepth === 'number') DEFAULT_EXPANDED_DEPTH = saved.expandedDepth;
    if (saved.panelStyle) {
      Object.keys(PANEL_STYLE).forEach(k => {
        if (saved.panelStyle[k] === 'compact' || saved.panelStyle[k] === 'structured') PANEL_STYLE[k] = saved.panelStyle[k];
      });
    }
    if (saved.detailFieldsByKind) {
      Object.keys(DETAIL_FIELDS_BY_KIND).forEach(k => {
        applyOrderAndVisibility(DETAIL_FIELDS_BY_KIND[k], saved.detailFieldsByKind[k], f => f.key);
      });
    }
    applyOrderAndVisibility(SUMMARY_FIELDS, saved.summaryFields, r => r.label);
  }

  function readJSON(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // Every visitor gets the locked default (if the maintainer has set one) as
  // their baseline; on top of that, THIS viewer's own live override (if
  // they're the maintainer and have adjusted something in this browser).
  function loadSettings() {
    applySnapshot(readJSON(LOCKED_KEY));
    applySnapshot(readJSON(SETTINGS_KEY));
  }

  function rerenderAfterSettingsChange(scope) {
    saveSettings();
    if (scope === 'depth' && activeCategory) {
      renderSidebarTree(activeCategory);
      // rebuilding the tree drops the .selected highlight - restore it if
      // the selected node is still in the tree that was just rebuilt
      if (selectedId) {
        const rec = recordOf(selectedId);
        if (rec && rec.storeKey === activeCategory) {
          expandAncestors(selectedId);
          document.querySelectorAll('.node-row[data-id="' + selectedId + '"]').forEach(r => r.classList.add('selected'));
        }
      }
    }
    if (selectedId && (scope === 'style' || scope.indexOf('fields:') === 0)) {
      const rec = recordOf(selectedId);
      const relevantKind = scope === 'style' ? rerenderAfterSettingsChange.styleKind : scope.slice('fields:'.length);
      if (rec && rec.storeKey === relevantKind) renderDetail(selectedId);
    }
    if (activeTab === 'summary' && (scope === 'summary' || (scope === 'style' && rerenderAfterSettingsChange.styleKind === 'summary'))) renderSummary();
  }

  // Drag-and-drop reordering (native HTML5 DnD - no library needed). `items`
  // is the same array object DETAIL_FIELDS_BY_KIND[kind] / SUMMARY_FIELDS
  // points at, so a reorder here is immediately visible to both the
  // structured and compact renderers - they both read field order from that
  // one shared array via fieldsFor(rec), there's no separate per-style copy.
  function buildReorderableChecklist(container, items, getLabel, scope) {
    container.innerHTML = '';
    let dragFromIdx = null;
    items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'settings-field-row';
      row.draggable = true;

      const handle = document.createElement('span');
      handle.className = 'settings-drag-handle';
      handle.textContent = '⠿'; // braille "dots" glyph, reads as a drag grip
      handle.title = 'Drag to reorder';
      handle.setAttribute('aria-hidden', 'true');
      row.appendChild(handle);

      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !item.__hidden;
      checkbox.addEventListener('change', () => {
        item.__hidden = !checkbox.checked;
        rerenderAfterSettingsChange(scope);
      });
      label.appendChild(checkbox);
      const nameSpan = document.createElement('span');
      nameSpan.className = 'settings-field-name';
      nameSpan.textContent = getLabel(item);
      label.appendChild(nameSpan);
      row.appendChild(label);

      row.addEventListener('dragstart', (e) => {
        dragFromIdx = idx;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(idx)); } catch (err) { /* Safari needs a get too, but doesn't require it to work */ }
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        container.querySelectorAll('.settings-field-row.drag-over').forEach(r => r.classList.remove('drag-over'));
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault(); // required for drop to fire at all
        e.dataTransfer.dropEffect = 'move';
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const from = dragFromIdx;
        const to = idx;
        dragFromIdx = null;
        if (from === null || from === to) return;
        items.splice(to, 0, items.splice(from, 1)[0]);
        rerenderAfterSettingsChange(scope);
        buildReorderableChecklist(container, items, getLabel, scope);
      });

      container.appendChild(row);
    });
  }

  // The settings panel has its own small tab bar, mirroring the page's tabs
  // (Summary + whichever hierarchy tabs are present) - each shows only the
  // fields relevant to that tab, per your point that Classes shouldn't offer
  // Data Types' predicates and vice versa.
  let settingsActiveTab = DATA.tabs.length ? DATA.tabs[0].id : null;

  function buildSettingsPanel() {
    const body = document.getElementById('settings-body');
    body.innerHTML = '';

    // Hierarchy depth - one shared setting, applies to every sidebar tree
    const depthSection = document.createElement('div');
    depthSection.className = 'settings-section';
    const depthHeading = document.createElement('h3');
    depthHeading.textContent = 'Hierarchy';
    depthSection.appendChild(depthHeading);
    const depthRow = document.createElement('div');
    depthRow.className = 'settings-row';
    const depthLabel = document.createElement('label');
    depthLabel.textContent = 'Levels expanded by default';
    depthRow.appendChild(depthLabel);
    const stepper = document.createElement('div');
    stepper.className = 'settings-stepper';
    const minusBtn = document.createElement('button');
    minusBtn.type = 'button';
    minusBtn.textContent = '−';
    const depthValue = document.createElement('span');
    depthValue.textContent = String(DEFAULT_EXPANDED_DEPTH);
    const plusBtn = document.createElement('button');
    plusBtn.type = 'button';
    plusBtn.textContent = '+';
    function setDepth(d) {
      DEFAULT_EXPANDED_DEPTH = Math.max(0, Math.min(6, d));
      depthValue.textContent = String(DEFAULT_EXPANDED_DEPTH);
      minusBtn.disabled = DEFAULT_EXPANDED_DEPTH === 0;
      plusBtn.disabled = DEFAULT_EXPANDED_DEPTH === 6;
      rerenderAfterSettingsChange('depth');
    }
    minusBtn.addEventListener('click', () => setDepth(DEFAULT_EXPANDED_DEPTH - 1));
    plusBtn.addEventListener('click', () => setDepth(DEFAULT_EXPANDED_DEPTH + 1));
    minusBtn.disabled = DEFAULT_EXPANDED_DEPTH === 0;
    plusBtn.disabled = DEFAULT_EXPANDED_DEPTH === 6;
    stepper.appendChild(minusBtn);
    stepper.appendChild(depthValue);
    stepper.appendChild(plusBtn);
    depthRow.appendChild(stepper);
    depthSection.appendChild(depthRow);
    body.appendChild(depthSection);

    // Per-tab settings: Summary fields, or (Panel Style + Detail Fields) for a hierarchy tab
    const tabBar = document.createElement('div');
    tabBar.className = 'settings-tabbar';
    DATA.tabs.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'settings-tab-btn' + (t.id === settingsActiveTab ? ' active' : '');
      btn.textContent = t.label;
      btn.addEventListener('click', () => { settingsActiveTab = t.id; buildSettingsPanel(); });
      tabBar.appendChild(btn);
    });
    body.appendChild(tabBar);

    const tabContent = document.createElement('div');
    tabContent.className = 'settings-tab-content';
    body.appendChild(tabContent);

    // Style select is the same control for every tab that has one (Summary
    // included) - just pointed at a different PANEL_STYLE key.
    function buildStyleSection(kind) {
      const styleSection = document.createElement('div');
      styleSection.className = 'settings-section';
      const styleHeading = document.createElement('h3');
      styleHeading.textContent = 'Content Panel Style';
      styleSection.appendChild(styleHeading);
      const styleRow = document.createElement('div');
      styleRow.className = 'settings-row';
      const styleLabel = document.createElement('label');
      styleLabel.textContent = 'Structured or compact';
      styleRow.appendChild(styleLabel);
      const select = document.createElement('select');
      select.className = 'settings-select';
      ['structured', 'compact'].forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt === 'structured' ? 'Structured' : 'Compact';
        if (PANEL_STYLE[kind] === opt) o.selected = true;
        select.appendChild(o);
      });
      select.addEventListener('change', () => {
        PANEL_STYLE[kind] = select.value;
        rerenderAfterSettingsChange.styleKind = kind;
        rerenderAfterSettingsChange('style');
        updateStyleToggleBtn();
      });
      styleRow.appendChild(select);
      styleSection.appendChild(styleRow);
      return styleSection;
    }

    if (settingsActiveTab === 'summary') {
      tabContent.appendChild(buildStyleSection('summary'));

      const fieldsSection = document.createElement('div');
      fieldsSection.className = 'settings-section';
      const heading = document.createElement('h3');
      heading.textContent = 'Summary Fields';
      fieldsSection.appendChild(heading);
      const list = document.createElement('div');
      list.className = 'settings-field-list';
      fieldsSection.appendChild(list);
      buildReorderableChecklist(list, SUMMARY_FIELDS, r => r.label, 'summary');
      tabContent.appendChild(fieldsSection);
    } else if (settingsActiveTab && DETAIL_FIELDS_BY_KIND[settingsActiveTab]) {
      const kind = settingsActiveTab;
      tabContent.appendChild(buildStyleSection(kind));

      const fieldsSection = document.createElement('div');
      fieldsSection.className = 'settings-section';
      const fieldsHeading = document.createElement('h3');
      fieldsHeading.textContent = 'Detail Panel Fields';
      fieldsSection.appendChild(fieldsHeading);
      const fieldsHint = document.createElement('div');
      fieldsHint.className = 'settings-hint';
      fieldsHint.textContent = 'Includes every predicate seen on at least one ' + (DATA.tabs.find(t => t.id === kind) || {}).label + ' entity.';
      fieldsSection.appendChild(fieldsHint);
      const list = document.createElement('div');
      list.className = 'settings-field-list';
      fieldsSection.appendChild(list);
      buildReorderableChecklist(list, DETAIL_FIELDS_BY_KIND[kind], fieldDisplayName, 'fields:' + kind);
      tabContent.appendChild(fieldsSection);
    }

    // Lock status + show/hide the lock/unlock buttons appropriately
    const lockStatusEl = document.getElementById('settings-lock-status');
    const hasLock = !!readJSON(LOCKED_KEY);
    lockStatusEl.hidden = !hasLock;
    lockStatusEl.textContent = hasLock ? '✓ A default configuration is locked in for all viewers.' : '';
    document.getElementById('settings-unlock').hidden = !hasLock;
  }

  // Global structured/compact toggle - available to every visitor (not
  // gated by maintainer mode), sitting next to the settings gear. It just
  // sets the same PANEL_STYLE entries the settings panel's per-tab selects
  // control, but for every tab at once (Summary included), so it's a quick
  // way to flip everything without opening the panel at all.
  const styleToggleBtn = document.getElementById('style-toggle-btn');
  const STYLE_TAB_IDS = DATA.tabs.map(t => t.id);
  function currentGlobalStyle() {
    if (!STYLE_TAB_IDS.length) return 'structured';
    const first = PANEL_STYLE[STYLE_TAB_IDS[0]];
    return STYLE_TAB_IDS.every(id => PANEL_STYLE[id] === first) ? first : 'structured';
  }
  function updateStyleToggleBtn() {
    const style = currentGlobalStyle();
    styleToggleBtn.textContent = style === 'compact' ? 'View: Compact' : 'View: Structured';
    styleToggleBtn.setAttribute('aria-pressed', style === 'compact' ? 'true' : 'false');
  }
  if (STYLE_TAB_IDS.length) {
    styleToggleBtn.addEventListener('click', () => {
      const next = currentGlobalStyle() === 'compact' ? 'structured' : 'compact';
      STYLE_TAB_IDS.forEach(id => { PANEL_STYLE[id] = next; });
      updateStyleToggleBtn();
      saveSettings();
      if (selectedId) renderDetail(selectedId);
      if (activeTab === 'summary') renderSummary();
    });
  } else {
    styleToggleBtn.remove();
  }

  const settingsBtn = document.getElementById('settings-btn');
  if (!isMaintainerMode()) {
    // not just visually hidden - not present at all for a general visitor
    settingsBtn.remove();
  } else {
    const settingsOverlay = document.getElementById('settings-overlay');
    function openSettings() {
      buildSettingsPanel();
      settingsOverlay.hidden = false;
    }
    function closeSettings() { settingsOverlay.hidden = true; }
    settingsBtn.addEventListener('click', openSettings);
    document.getElementById('settings-close').addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettings(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !settingsOverlay.hidden) closeSettings(); });

    document.getElementById('settings-reset').addEventListener('click', () => {
      // back to the locked default if one exists, else the ttl-baked factory default
      try { localStorage.removeItem(SETTINGS_KEY); } catch (e) { /* ignore */ }
      location.reload();
    });
    document.getElementById('settings-lock').addEventListener('click', () => {
      try {
        const snapshot = JSON.stringify(currentSettingsSnapshot());
        localStorage.setItem(LOCKED_KEY, snapshot);
        localStorage.setItem(SETTINGS_KEY, snapshot);
      } catch (e) { /* ignore */ }
      buildSettingsPanel();
    });
    document.getElementById('settings-unlock').addEventListener('click', () => {
      try { localStorage.removeItem(LOCKED_KEY); } catch (e) { /* ignore */ }
      buildSettingsPanel();
    });
  }

  loadSettings();
  if (STYLE_TAB_IDS.length) updateStyleToggleBtn();

  // ---- initial view ----
  // sidebar defaults to the first hierarchy tab (Summary has no tree of its own);
  // the visible tab defaults to Summary when present, else that same first hierarchy tab
  if (CATEGORY_TABS.length) {
    activeCategory = CATEGORY_TABS[0].id;
    renderSidebarTree(activeCategory);
  }
  activeTab = HAS_SUMMARY ? 'summary' : (CATEGORY_TABS[0] && CATEGORY_TABS[0].id);
  markActiveTabButton();
  if (activeTab === 'summary') {
    renderSummary();
  }

  // restore a selection from a deep-linked URL (e.g. .../<ontology>/#tara-kb:hasBlindingQualityScore)
  (function restoreFromHash() {
    const initial = location.hash.slice(1);
    if (initial && recordOf(initial)) {
      selectNode(initial, { pushHistory: false });
    }
  })();
})();
</script>
</body>
</html>
