    "tara-kb:hasControlGroupsDetails": {
      "id": "tara-kb:hasControlGroupsDetails",
      "kind": "property",
      "label": "Control Groups Details",
      "altLabel": "Control_Groups_Details",
      "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasControlGroupsDetails",
      "description": "An annotation property to capture structured details about the control group methodologies (control arms) deployed within a clinical trial study, as reported in a journal publication. It explicitly documents the specific type of control utilized, such as sham interventions, non-acupoint/minimal treatments, active controls, or waitlists, along with critical methodological protocols, including patient blinding mechanisms, the physiological nature of the control, and any deviations from standard or traditional practices meant to isolate specific therapeutic variables.",
      "comment": "Acupuncture control groups are fundamentally classified into four main methodological paradigms:\n1) Sham Acupuncture: Placebo needling using non-penetrating retracting devices to isolate needling-specific effects;\n2) Real Acupuncture at Non-Acupoints: Minimal acupuncture using standard needles at non-meridian locations to isolate point-specificity;\n3) Active Control: Ttreatment-as-usual, standard care, or pharmacotherapy to test clinical superiority/equivalence; and\n4) Waitlist or No-Treatment Control: To measure natural disease progression. \n\nNote: Researchers must account for the 'physiological sham effect,' where even non-penetrating skin pressure or non-acupoint stimulation can trigger local neurological and circulatory responses, meaning these controls are rarely completely inert.",
      "examples": [
        "Control Arm 1 - Sham Acupuncture: Deployed Streitberger non-penetrating placebo needles at valid acupoints. Patients were successfully blinded to needle penetration, though mild skin pressure-induced neurological stimulation remains a potential confounding physiological sham effect.\n\nControl Arm 2 - Non-Acupoint Real Needling: Used identical standard 0.25mm stainless steel needles fully inserted to standard depths (15mm), but placed 2-3 cm away from traditional meridians in anatomically neutral zones to test point-specificity.\n\nControl Arm 3 - Active Control: Standard Care regimen consisting of prescribed physical therapy twice weekly and open-label Naproxen (500mg daily) to evaluate clinical superiority.",
        "Sham acupuncture: Patients received sham acupuncture once a week for 6 weeks, using blunt-tipped needles that did not penetrate the skin, as a control group to compare with true acupuncture."
      ],
      "grouping": false,
      "domain": "TARA:6701896",
      "domainLabel": "Acupuncture Research Study",
      "range": {
        "kind": "literal",
        "id": null,
        "label": "xsd:string"
      },
      "parent": "tara-kb:hasStudyDesignMetadata",
      "children": [],
      "synonyms": []
    },

    "tara-kb:hasStudyFindings": {
      "id": "tara-kb:hasStudyFindings",
      "kind": "property",
      "label": "Study Findings",
      "altLabel": "Study_Findings",
      "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasStudyFindings",
      "description": "A dual-purpose annotation property that serves as a super-property grouping the interpreted findings sub-properties (clinical conclusions, comparative findings, effectiveness, main results, and proposed mechanism), while simultaneously acting as a direct container for a general free-text stuctured summary of the study's findings when a more specific sub-property does not apply.\n\nThis field should faithfully summarize what the paper reports as main results (the core numeric and statistical information of the primary and secondary endpoints) and clinical conclusions in a structured way, potentially including short direct quotations where appropriate.",
      "comment": "In systematic reviews and clinical trial metadata, \"Findings\" or \"Conclusions\" are explicitly separated from raw outcome measures because they capture the interpreted results, statistical significance, and final takeaways of the research.",
      "examples": [
        "\"Main Results: The primary outcome showed a mean reduction of 2·3 days (95% CI 1·9–2·7) in the verum acupuncture group, 1·5 days (1·1–2·0) in the sham acupuncture group, and 2·1 days (1·5–2·7) in the standard therapy group. These differences were statistically significant compared with baseline (p<0·0001), but not across the treatment groups (p=0·09).\n\nClinical Conclusions: Treatment outcomes for migraine do not differ between patients treated with sham acupuncture, verum acupuncture, or standard therapy.\"\n\nThe example above captures the study findings based on the results and conclusions from the study 'Efficacy of acupuncture for the prophylaxis of migraine: a multicentre randomised controlled clinical trial'; PubMed link: https://pubmed.ncbi.nlm.nih.gov/16545747"
      ],
      "grouping": false,
      "domain": "TARA:6701896",

    "tara-kb:hasStudyQualityAssessmentMetadata": {
      "id": "tara-kb:hasStudyQualityAssessmentMetadata",
      "kind": "property",
      "label": "Study Assessment Metadata",
      "altLabel": "Study_Assessment_Metadata",
      "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasStudyQualityAssessmentMetadata",
      "description": "An annotation property that serves as a high-level grouping property under which specific quality appraisal properties are defined to record evaluative quality data, risk-of-bias scores, and methodological rigor metrics calculated for a clinical trial study.\n\nCrucially, the values asserted by the sub-properties under this property are not raw data elements directly extracted or verbatim copied from the published journal article. Instead, they represent secondary, derived appraisals generated, either algorithmically by automated computational models or manually by human domain experts, by evaluating an extracted set of primary metadata against standardized scoring frameworks and quality assessment criteria (such as OCSI).",
      "comment": null,
      "examples": [],
      "grouping": true,
      "domain": "TARA:7227329",
      "domainLabel": "Research Study Quality Assessment",
      "range": {
        "kind": null,
        "id": null,

    "tara-kb:hasOCSIItemScoringMetadata": {
      "id": "tara-kb:hasOCSIItemScoringMetadata",
      "kind": "property",
      "label": "OCSI Item Scoring Metadata",
      "altLabel": "OCSI_Item_Scoring_Metadata",
      "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasOCSIItemScoringMetadata",
      "description": "An annotation property that serves as a master grouping property for capturing quality assessment metrics mapped to individual reporting items within the Oregon CONSORT STRICTA Instrument (OCSI) for acupuncture trials. \n\nTARA-KB's sub-grouping of OCSI assessment categories (A-D), aggregate derived compliance values specifically tied to the combined CONSORT (Consolidated Standards of Reporting Trials) and STRICTA (Standards for Reporting Interventions in Clinical Trials of Acupuncture) guidelines. It organizes granular sub-properties tracking item-by-item compliance scores, separating the calculated evaluation of reporting quality from the raw extracted study parameters.\n\nThe sub-grouping properties across all four categories (A-D), are reporting-quality metrics: they assess how completely and transparently a trial was described in its published article, not the intrinsic quality, appropriateness, or clinical merit of the trial's design, intervention, or conduct. A high OCSI score means the article reported its methods and results thoroughly; it does not mean the underlying trial was well-designed or its findings reliable.",
      "comment": "Item questions (Table 1) and scoring rubrics (Appendix A) reproduced under the CC-BY license, with attribution to the original authors. / Scoring scale and total score formula (Hammerschlag et al. 2011, Section 2.1 and 2.3):\n- Each of the 27 OCSI questions is scored yes = 2, partial = 1, no = 0, or Not Applicable = N/A, based on the composite scoring of its lettered sub-questions. A question is scored partial if its sub-questions receive a mix of ratings.\n- An article's total OCSI score is calculated as: raw score ÷ (2 × [27 − n items scored N/A]) × 100, i.e., items scored N/A are excluded from both the numerator and the denominator rather than counted as zero.",
      "examples": [],
      "grouping": true,
      "domain": "TARA:2825659",
      "domainLabel": "Acupuncture Study OCSI Assessment",
      "range": {
        "kind": null,
        "id": null,
        "label": null
      },
      "parent": "tara-kb:hasStudyQualityAssessmentMetadata",
      "children": [
        "tara-kb:hasStudyRationaleAndScopeMetrics",
        "tara-kb:hasAcupunctureInterventionMetrics",
        "tara-kb:hasStudyDesignAndAnalysisMetrics",
        "tara-kb:hasResultsAndDiscussionMetrics",
        "tara-kb:hasOCSITotalPercentage"
      ],
      "synonyms": []
    },
    "tara-kb:hasAcupunctureInterventionMetrics": {
      "id": "tara-kb:hasAcupunctureInterventionMetrics",
      "kind": "property",
      "label": "Category B: Acupuncture Intervention Metrics",
      "altLabel": "Acupuncture_Intervention_Metrics",
      "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasAcupunctureInterventionMetrics",
      "description": "This is a TARA-KB convention of categorization: Category B, Acupuncture Intervention Metrics, groups OCSI items 4 through 9, which report on the acupuncture intervention itself and correspond one-to-one, in order, to the six official STRICTA 2010 checklist items -- (1) Acupuncture rationale, (2) Details of needling, (3) Treatment regimen, (4) Other components of treatment, (5) Practitioner background, (6) Control or comparator interventions -- since Hammerschlag et al. 2011 state these six items substitute for CONSORT's own item 4.",
      "comment": "The umbrella label 'Acupuncture Intervention Metrics' and its place in this ontology's four-category scheme (A/B/C/D) are a TARA-KB convention, not STRICTA's own terminology. This category's item membership (OCSI items 4-9), however, is directly traceable to STRICTA (MacPherson et al. 2010), with an exact one-to-one, in-order correspondence to STRICTA's six official checklist items. Unlike an earlier version of this ontology, hasSampleSizeScore (OCSI item 12) is no longer nested here: item 12 is a plain CONSORT item (sample size determination), not one of STRICTA's six items, and has been moved to Category C (hasStudyDesignAndAnalysisMetrics), making this category's membership an exact match to STRICTA's item set.",
      "examples": [
        "e.g., an aggregate value of 12 summarizing the combined STRICTA-aligned sub-scores (acupuncture details, needling parameters, treatment frequency, cointerventions, practitioner background, control group details)."
      ],
      "grouping": true,
      "domain": "TARA:2825659",
      "domainLabel": "Acupuncture Study OCSI Assessment",
      "range": {
        "kind": null,
        "id": null,
        "label": null
      },
      "parent": "tara-kb:hasOCSIItemScoringMetadata",
      "children": [

    "tara-kb:hasResultsOutcomesScore": {
      "id": "tara-kb:hasResultsOutcomesScore",
      "kind": "property",
      "label": "Results Outcomes Score",
      "altLabel": "Results_Outcomes_Score",
      "uri": "http://www.acupunctureresearch.org/tara/ontology/kb/hasResultsOutcomesScore",
      "description": "A quality metric within Category D: Results and Discussion Metrics that assesses the completeness, transparency, and accuracy of the reported results for each predefined primary and secondary outcome measure, evaluating whether the text explicitly provides estimated effect sizes, confidence intervals, and precise statistical significance values (e.g., p-values) for each endpoint.",
      "comment": "To maintain data integrity and prevent construct contamination within the metadata schema, ensure that the data extraction models treat the following two properties separately:\n1. hasOutcomesMeasureX2Score (Methodology/Design Check): Focuses on the definition and planned pairing of tests. (e.g., Did they tell us in the Methods section how they planned to calculate the math?)\n2. hasResultsOutcomesScore (Reporting/Transparency Check): Focuses on the execution and transparency of the actual data. (e.g., Did they actually show us the exact numbers, tables, effect sizes, and p-values in the Results section?)",
      "examples": [
        "Standardized Scoring Rubric (0–3 Scale) \nFollowing the standardized OCSI Likert-like scoring structure, the reporting of results should be scored based on the level of statistical disclosure and data transparency:\n- 3 (Full Compliance): The study provides exact data for all predefined outcomes (whether evaluating a single primary outcome or primary + secondary outcomes). This includes specific numbers/estimates, precision metrics (e.g., 95% Confidence Intervals), and exact p-values for each finding.\n- 2 (Substantial Compliance): Results are provided for all main outcomes, but exact statistical precision reporting is slightly flawed (e.g., reporting a generic \"p < 0.05\" or omitting confidence intervals for a minor secondary outcome).\n- 1 (Partial Compliance): The study omits data for a major outcome, or results are reported selectively/vaguely (e.g., stating in text that \"group differences were not significant\" without actually providing the underlying data table or values).\n- 0 (Non-compliance): No empirical results or raw data are presented for the stated primary outcomes, or data reporting is missing entirely.",
        "e.g., a score of 2 when reported results directly correspond to the pre-registered outcome measures, or 0 when a mismatch or omission exists."
      ],
      "grouping": false,
      "domain": "TARA:2825659",
      "domainLabel": "Acupuncture Study OCSI Assessment",
      "range": {
        "kind": "literal",
        "id": null,
        "label": "ocsiItemScore"

      "description": "This is a TARA-KB convention of categorization: Category A, Study Rationale and Scope Metrics, groups the OCSI items that establish why a trial was undertaken and what it covers before its methods and results are reported -- scientific background and rationale (item 2) and the stated objectives and hypothesis (item 10) address the rationale; eligibility criteria and study setting (item 3) define the trial's population and location scope. The randomization statement (item 1) is grouped here as a scope-defining fact in a different sense -- it discloses what kind of trial this is (randomized) rather than its population or setting -- rather than as a strict domain match; see rdfs:comment for further explanation of this placement.",

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('tara-data').textContent);
  const CLASSES = DATA.classes;
  const PROPERTIES = DATA.properties;

  function recordOf(id) { return PROPERTIES[id] || CLASSES[id] || null; }
  function kindOf(id) { return PROPERTIES[id] ? 'properties' : 'classes'; }

  // ---- sidebar tabs ----
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(btn => btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tree-properties').style.display = btn.dataset.tab === 'properties' ? '' : 'none';
    document.getElementById('tree-classes').style.display = btn.dataset.tab === 'classes' ? '' : 'none';
  }));
  function activateTab(tab) {
    tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('tree-properties').style.display = tab === 'properties' ? '' : 'none';
    document.getElementById('tree-classes').style.display = tab === 'classes' ? '' : 'none';
  }

  // ---- resizable splitter (sidebar width, capped at 35% of page width) ----
  const sidebarEl = document.getElementById('sidebar');
  const splitterEl = document.getElementById('splitter');
  const SIDEBAR_MIN_WIDTH = 220;
  let splitterDragging = false;

  splitterEl.addEventListener('mousedown', (e) => {
    splitterDragging = true;
    splitterEl.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!splitterDragging) return;
    const maxWidth = window.innerWidth * 0.35;
    const newWidth = Math.min(Math.max(e.clientX, SIDEBAR_MIN_WIDTH), maxWidth);
    sidebarEl.style.width = newWidth + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!splitterDragging) return;
    splitterDragging = false;
    splitterEl.classList.remove('dragging');
    document.body.style.userSelect = '';
  });

  // ---- tree rendering ----
  const TOGGLE_COLLAPSED = '▶'; // ▶
  const TOGGLE_EXPANDED = '▼'; // ▼
  const DEFAULT_EXPANDED_DEPTH = 2; // 0-indexed: depths 0 and 1 start expanded, so levels 1-3 are visible by default

  function buildNode(id, store, depth) {
    depth = depth || 0;
    const rec = store[id];
    const li = document.createElement('li');
    li.dataset.id = id;

    const row = document.createElement('div');
    row.className = 'node-row' + (rec.grouping ? ' grouping' : '');
    row.dataset.id = id;

    const hasChildren = rec.children && rec.children.length > 0;
    const toggle = document.createElement('span');
    toggle.className = 'toggle' + (hasChildren ? '' : ' leaf');
    toggle.textContent = hasChildren ? TOGGLE_COLLAPSED : '-';
    row.appendChild(toggle);

    const label = document.createElement('span');
    label.className = 'node-label';
    label.textContent = rec.label;
    row.appendChild(label);

    li.appendChild(row);

    let childUl = null;
    if (hasChildren) {
      const startExpanded = depth < DEFAULT_EXPANDED_DEPTH;
      childUl = document.createElement('ul');
      childUl.style.display = startExpanded ? '' : 'none';
      toggle.textContent = startExpanded ? TOGGLE_EXPANDED : TOGGLE_COLLAPSED;
      rec.children.forEach(cid => childUl.appendChild(buildNode(cid, store, depth + 1)));
      li.appendChild(childUl);

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = childUl.style.display !== 'none';
        childUl.style.display = open ? 'none' : '';
        toggle.textContent = open ? TOGGLE_COLLAPSED : TOGGLE_EXPANDED;
      });
    }

    row.addEventListener('click', () => selectNode(id));
    return li;
  }

  function renderTree(containerId, rootIds, store) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const ul = document.createElement('ul');
    rootIds.forEach(rid => ul.appendChild(buildNode(rid, store, 0)));
    container.appendChild(ul);
  }

  renderTree('tree-properties', [DATA.propertyRoot], PROPERTIES);
  renderTree('tree-classes', DATA.classRoots, CLASSES);

  function expandAncestors(id) {
    const rec = recordOf(id);
    if (!rec) return;
    let cur = rec.parent;
    const store = PROPERTIES[id] ? PROPERTIES : CLASSES;
    while (cur) {
      const row = document.querySelector('.node-row[data-id="' + cur + '"]');
      if (row) {
        const li = row.parentElement;
        const ul = li.querySelector(':scope > ul');
        if (ul) {
          ul.style.display = '';
          const t = row.querySelector('.toggle');
          if (t && !t.classList.contains('leaf')) t.textContent = TOGGLE_EXPANDED;
        }
      }
      cur = store[cur] ? store[cur].parent : null;
    }
  }

  // ---- selection & detail panel ----
  let selectedId = null;

  function selectNode(id, opts) {
    opts = opts || {};
    selectedId = id;
    document.querySelectorAll('.node-row.selected').forEach(el => el.classList.remove('selected'));
    if (opts.switchTab !== false) activateTab(kindOf(id));
    expandAncestors(id);
    const row = document.querySelector('.node-row[data-id="' + id + '"]');
    if (row) {
      row.classList.add('selected');
      row.scrollIntoView({ block: 'center' });
      row.parentElement.classList.add('flash');
      setTimeout(() => row.parentElement.classList.remove('flash'), 1400);
    }
    renderDetail(id);
    // record this selection as a browser-history entry (deep-linkable via '#id' too),
    // so the browser's native Back/Forward buttons step through past selections -
    // skipped when we're the ones restoring a state FROM a popstate/deep-link, to
    // avoid pushing a duplicate entry on top of the one already being navigated to.
    if (opts.pushHistory !== false) {
      history.pushState({ id: id }, '', '#' + id);
    }
  }

  function clearSelection() {
    selectedId = null;
    document.querySelectorAll('.node-row.selected').forEach(el => el.classList.remove('selected'));
    document.getElementById('content').innerHTML =
      '<p class="placeholder">Select a class or property from the left, or search above.</p>';
  }

  window.addEventListener('popstate', (e) => {
    const id = e.state && e.state.id;
    if (id && recordOf(id)) {
      selectNode(id, { pushHistory: false });
    } else {
      clearSelection();
    }
  });

  // restore a selection from a deep-linked URL (e.g. .../articles-kb-core/#tara-kb:hasBlindingQualityScore)
  (function restoreFromHash() {
    const initial = location.hash.slice(1);
    if (initial && recordOf(initial)) {
      selectNode(initial, { pushHistory: false });
    }
  })();

  function chip(text, onClick) {
    const el = document.createElement('span');
    el.className = 'chip' + (onClick ? ' link' : '');
    el.textContent = text;
    if (onClick) el.addEventListener('click', onClick);
    return el;
  }

  function fieldLabel(text) {
    const el = document.createElement('div');
    el.className = 'field-label';
    el.textContent = text;
    return el;
  }

  function prose(text) {
    const el = document.createElement('div');
    el.className = 'prose';
    el.textContent = text;
    return el;
  }

  // Renders propIds (a flat list of property ids sharing one domain class) as a
  // nested tree following tara-kb:hasTARAArticlesMetadata structure, instead of
  // one flat chip list - grouping properties (e.g. "Category B: ...") show their
  // members nested underneath instead of as unrelated siblings. An ancestor that
  // isn't itself in propIds (its own domain differs or is unset) is still shown,
  // dimmed, purely as structural connective tissue to the nearest visible root.
  function buildDomainTree(propIds) {
    const include = new Set(propIds);
    const connectors = new Set();
    include.forEach(id => {
      let cur = PROPERTIES[id] ? PROPERTIES[id].parent : null;
      while (cur && !include.has(cur) && !connectors.has(cur)) {
        connectors.add(cur);
        cur = PROPERTIES[cur] ? PROPERTIES[cur].parent : null;
      }
    });
    const all = new Set([...include, ...connectors]);
    const roots = [...all]
      .filter(id => { const p = PROPERTIES[id].parent; return !p || !all.has(p); })
      .sort((a, b) => PROPERTIES[a].label.localeCompare(PROPERTIES[b].label));

    function renderNode(id) {
      const rec = PROPERTIES[id];
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'node-row' + (rec.grouping ? ' grouping' : '') + (connectors.has(id) ? ' connector' : '');
      row.dataset.id = id;
      if (connectors.has(id)) row.title = 'Shown for structure only — its own domain differs from this class';
      const bullet = document.createElement('span');
      bullet.className = 'toggle leaf';
      bullet.textContent = '-';
      row.appendChild(bullet);
      const label = document.createElement('span');
      label.className = 'node-label';
      label.textContent = rec.label;
      row.appendChild(label);
      row.addEventListener('click', () => selectNode(id));
      li.appendChild(row);

      const children = (rec.children || [])
        .filter(cid => all.has(cid))
        .sort((a, b) => PROPERTIES[a].label.localeCompare(PROPERTIES[b].label));
      if (children.length) {
        const ul = document.createElement('ul');
        children.forEach(cid => ul.appendChild(renderNode(cid)));
        li.appendChild(ul);
      }
      return li;
    }

    const container = document.createElement('div');
    container.className = 'tree domain-tree';
    const ul = document.createElement('ul');
    roots.forEach(rid => ul.appendChild(renderNode(rid)));
    container.appendChild(ul);
    return container;
  }

  function renderDetail(id) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const rec = recordOf(id);
    if (!rec) { content.innerHTML = '<p class="placeholder">Not found.</p>'; return; }

    const h = document.createElement('h2');
    h.textContent = rec.label;
    content.appendChild(h);

    const badgeRow = document.createElement('div');
    badgeRow.className = 'chip-row';
    const kindBadge = document.createElement('span');
    kindBadge.className = 'type-badge';
    kindBadge.textContent = rec.kind === 'property' ? (rec.grouping ? 'Grouping Property' : 'Property') : 'Class';
    badgeRow.appendChild(kindBadge);
    const qBadge = document.createElement('span');
    qBadge.className = 'qname-badge';
    qBadge.textContent = rec.id;
    badgeRow.appendChild(qBadge);
    content.appendChild(badgeRow);

    if (rec.altLabel) {
      content.appendChild(fieldLabel('Alt Label (skos:altLabel)'));
      content.appendChild(prose(rec.altLabel));
    }

    if (rec.description) {
      content.appendChild(fieldLabel('Description'));
      content.appendChild(prose(rec.description));
    }

    if (rec.comment) {
      content.appendChild(fieldLabel('Comment / Normalization Rules'));
      content.appendChild(prose(rec.comment));
    }

    if (rec.kind === 'property') {
      if (rec.domain || rec.range.label) {
        content.appendChild(fieldLabel('Domain · Range'));
        const row = document.createElement('div');
        row.className = 'chip-row';
        if (rec.domain) {
          row.appendChild(chip('Domain: ' + rec.domainLabel, () => selectNode(rec.domain)));
        } else {
          row.appendChild(chip('Domain: not specified'));
        }
        if (rec.range.kind === 'class') {
          row.appendChild(chip('Range: ' + rec.range.label, () => selectNode(rec.range.id)));
        } else if (rec.range.label) {
          row.appendChild(chip('Range: ' + rec.range.label));
        } else {
          row.appendChild(chip('Range: not specified'));
        }
        content.appendChild(row);
      }

      if (rec.examples && rec.examples.length) {
        content.appendChild(fieldLabel('Examples (obo:IAO_0000112)'));
        rec.examples.forEach(ex => {
          const block = document.createElement('div');
          block.className = 'example-block';
          block.textContent = ex;
          content.appendChild(block);
        });
      }
    }

    if (rec.kind === 'class' && rec.propertiesWithThisDomain && rec.propertiesWithThisDomain.length) {
      content.appendChild(fieldLabel('Properties with this Domain'));
      content.appendChild(buildDomainTree(rec.propertiesWithThisDomain));
    }

    if (rec.synonyms && rec.synonyms.length) {
      content.appendChild(fieldLabel('Synonyms'));
      const row = document.createElement('div');
      row.className = 'chip-row';
      rec.synonyms.forEach(s => row.appendChild(chip(s)));
      content.appendChild(row);
    }

    if (rec.altLabels && rec.altLabels.length) {
      content.appendChild(fieldLabel('Alt Labels'));
      const row = document.createElement('div');
      row.className = 'chip-row';
      rec.altLabels.forEach(s => row.appendChild(chip(s)));
      content.appendChild(row);
    }

    if (rec.parent) {
      const store = rec.kind === 'property' ? PROPERTIES : CLASSES;
      const parentRec = store[rec.parent];
      if (parentRec) {
        content.appendChild(fieldLabel(rec.kind === 'property' ? 'Parent Property' : 'Superclass'));
        const row = document.createElement('div');
        row.className = 'chip-row';
        row.appendChild(chip(parentRec.label, () => selectNode(rec.parent)));
        content.appendChild(row);
      }
    }

    if (rec.children && rec.children.length) {
      const store = rec.kind === 'property' ? PROPERTIES : CLASSES;
      content.appendChild(fieldLabel(rec.kind === 'property' ? 'Sub-properties' : 'Subclasses'));
      const row = document.createElement('div');
      row.className = 'chip-row';
      rec.children.forEach(cid => row.appendChild(chip(store[cid].label, () => selectNode(cid))));
      content.appendChild(row);
    }
  }

  // ---- search / autocomplete / filter ----
  const searchInput = document.getElementById('search');
  const autocompleteEl = document.getElementById('autocomplete');
  let acItems = [];
  let acActiveIndex = -1;

  function searchableText(rec) {
    return [rec.label, rec.altLabel].concat(rec.synonyms || [], rec.altLabels || [])
      .filter(Boolean).join(' • ').toLowerCase();
  }

  function allEntries() {
    const all = Object.values(PROPERTIES).concat(Object.values(CLASSES));
    all.sort((a, b) => a.label.localeCompare(b.label));
    return all;
  }

  function matchIds(query) {
    const q = query.trim().toLowerCase();
    if (!q) return allEntries(); // empty query -> full pulldown of everything, browsable
    const results = [];
    Object.values(PROPERTIES).forEach(rec => { if (searchableText(rec).includes(q)) results.push(rec); });
    Object.values(CLASSES).forEach(rec => { if (searchableText(rec).includes(q)) results.push(rec); });
    results.sort((a, b) => a.label.localeCompare(b.label));
    return results;
  }

  function ancestorChain(id) {
    const chain = [];
    const store = PROPERTIES[id] ? PROPERTIES : CLASSES;
    let cur = store[id] ? store[id].parent : null;
    while (cur) { chain.push(cur); cur = store[cur] ? store[cur].parent : null; }
    return chain;
  }

  function applyFilter(query) {
    const matches = matchIds(query);
    const allTreeItems = document.querySelectorAll('#tree-properties li, #tree-classes li');
    if (!query.trim()) {
      allTreeItems.forEach(li => li.classList.remove('hidden-by-filter'));
      return;
    }
    const keep = new Set();
    matches.forEach(rec => { keep.add(rec.id); ancestorChain(rec.id).forEach(a => keep.add(a)); });
    allTreeItems.forEach(li => {
      li.classList.toggle('hidden-by-filter', !keep.has(li.dataset.id));
    });
    // auto-expand branches that contain a visible match
    keep.forEach(id => {
      const row = document.querySelector('.node-row[data-id="' + id + '"]');
      if (row) {
        const ul = row.parentElement.querySelector(':scope > ul');
        if (ul) {
          ul.style.display = '';
          const t = row.querySelector('.toggle');
          if (t && !t.classList.contains('leaf')) t.textContent = TOGGLE_EXPANDED;
        }
      }
    });
  }

  function renderAutocomplete(query) {
    acItems = matchIds(query).slice(0, 60);
    acActiveIndex = -1;
    autocompleteEl.innerHTML = '';
    if (acItems.length === 0) {
      autocompleteEl.style.display = 'none';
      return;
    }
    acItems.forEach((rec, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item';
      item.dataset.index = i;
      const badge = document.createElement('span');
      badge.className = 'ac-badge';
      badge.textContent = rec.kind === 'property' ? 'Prop' : 'Class';
      item.appendChild(badge);
      const label = document.createElement('span');
      label.textContent = rec.label;
      item.appendChild(label);
      item.addEventListener('mousedown', (e) => { e.preventDefault(); chooseAutocomplete(i); });
      autocompleteEl.appendChild(item);
    });
    // #autocomplete's stylesheet rule defaults to display:none, so clearing the
    // inline style here (display = '') would fall back to that and stay hidden -
    // must set an explicit visible value instead.
    autocompleteEl.style.display = 'block';
  }

  function chooseAutocomplete(i) {
    const rec = acItems[i];
    if (!rec) return;
    searchInput.value = rec.label;
    autocompleteEl.style.display = 'none';
    applyFilter('');
    selectNode(rec.id);
  }

  searchInput.addEventListener('input', () => {
    applyFilter(searchInput.value);
    renderAutocomplete(searchInput.value);
  });

  searchInput.addEventListener('focus', () => renderAutocomplete(searchInput.value));
  searchInput.addEventListener('click', () => renderAutocomplete(searchInput.value));

  searchInput.addEventListener('keydown', (e) => {
    if (autocompleteEl.style.display === 'none') return;
    const rows = autocompleteEl.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      acActiveIndex = Math.min(acActiveIndex + 1, rows.length - 1);
      rows.forEach((r, i) => r.classList.toggle('active', i === acActiveIndex));
      rows[acActiveIndex] && rows[acActiveIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      acActiveIndex = Math.max(acActiveIndex - 1, 0);
      rows.forEach((r, i) => r.classList.toggle('active', i === acActiveIndex));
      rows[acActiveIndex] && rows[acActiveIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      chooseAutocomplete(acActiveIndex >= 0 ? acActiveIndex : 0);
    } else if (e.key === 'Escape') {
      autocompleteEl.style.display = 'none';
    }
  });

  document.addEventListener('click', (e) => {
    if (!autocompleteEl.contains(e.target) && e.target !== searchInput) {
      autocompleteEl.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
